<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <header class="bar" id="bar">
    <nav class="nav">
      <button class="ghost" id="home" hidden>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        All games
      </button>
      <button class="ghost host" id="host" hidden></button>
    </nav>
    <div class="actions">
      <button class="outline" id="records">My records</button>
      <button class="primary" id="together">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.6-2.4 2.3-3.8 4.5-3.8s3.9 1.4 4.5 3.8"/><circle cx="11.5" cy="6" r="2"/><path d="M11 9.8c1.8 0 3 1.1 3.5 3"/></svg>
        Play together
      </button>
    </div>
  </header>

  <div class="backdrop" id="backdrop" hidden></div>
  <section class="panel" id="panel" role="dialog" aria-label="Play together" hidden>
    <div class="joined" id="joined" hidden>
      <p id="joined-text"></p>
      <button class="secondary" id="leave">Back to my games</button>
    </div>

    <div id="invite">
      <h2>Invite friends on this Wi‑Fi</h2>
      <p class="muted">They scan the code or open the link on a phone or computer. Nothing to install.</p>
      <div class="qr" id="qr"></div>
      <div class="link">
        <span id="url"></span>
        <button class="secondary" id="copy">Copy</button>
      </div>
    </div>
    <div id="offline" hidden>
      <h2>Not on a network</h2>
      <p class="muted">Connect to Wi‑Fi to play with people nearby. Every game still works offline on this Mac.</p>
    </div>

    <h2 class="nearby-title">Macs nearby</h2>
    <ul class="nearby" id="nearby"></ul>
    <p class="muted" id="nearby-empty">No one else on this network has Ludvig Games open.</p>
  </section>

  <script src="chrome.js"></script>
</body>
</html>
