<style>

<body>
<main id="game">
<canvas id="world" aria-label="Lighthouse platform game. Run right, jump over gaps, stomp creatures, and reach the lighthouse."></canvas>
<header id="hud" hidden>
 <div class="hud-left"><div><div id="hearts" aria-label="3 hearts"></div><div id="seals" aria-label="Sun seals"></div></div><div><div class="eyebrow">SCORE</div><div class="score" id="score">00000</div></div></div>
 <div class="route"><div id="zoneName">SUNLIT SHORE</div><div class="track"><div id="progress"></div></div></div>
 <div class="hud-right"><div class="metric"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><ellipse cx="12" cy="12" rx="7" ry="9" fill="#f2bd51" stroke="#b58032" stroke-width="2"/><path d="M12 7v10" stroke="#fff4d9" stroke-width="2"/></svg><span id="coins">00</span></div><div class="metric" id="clock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/></svg><span id="time">180</span></div></div>
</header>
<div id="tools">
 <button class="icon-button" id="boardButton" aria-label="Leaderboard" title="Leaderboard" hidden><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"/></svg></button>
 <button class="icon-button" id="pauseButton" aria-label="Pause game" title="Pause (Escape)" hidden><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
 <button class="icon-button" id="muteButton" aria-label="Mute sound" aria-pressed="false" title="Mute (M)"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="soundWaves" d="M15 8q5 4 0 8M18 5q8 7 0 14"/></svg></button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="power" hidden>SUNSHINE · <span id="powerTime">8</span></div>
<div id="desktopHint" hidden>← → MOVE &nbsp; / &nbsp; SPACE JUMP &nbsp; / &nbsp; SHIFT RUN</div>
<div id="touch" hidden>
 <div class="touch-move"><button class="pad" data-control="left" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="m15 4-9 8 9 8z"/></svg></button><button class="pad" data-control="right" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="m9 4 9 8-9 8z"/></svg></button></div>
 <button class="pad" id="jumpPad" data-control="jump" aria-label="Jump; hold for a higher jump"><svg viewBox="0 0 24 24"><path d="m12 4 9 10h-6v6H9v-6H3z"/></svg></button>
</div>
<section id="startScreen" class="screen" aria-label="Title screen">
 <div class="start-panel"><h1>Light<span>house</span></h1><button class="primary" id="startButton">Let's go <svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button><div class="controls"><div><b>← → / A D</b>Move</div><div><b>SPACE / CLICK</b>Hold to jump higher</div><div><b>SHIFT</b>Run</div></div><div id="touchHint">Hold the arrows to run. Hold ↑ to jump higher.</div><div class="best-line" id="startBest"></div></div>
</section>
<section id="pauseScreen" class="screen center-screen" aria-label="Pause menu" hidden><div class="card"><h2>PAUSED</h2><button class="primary" id="resumeButton">Keep going <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button><br><button class="secondary" id="restartPause">Start a new run</button></div></section>
<section id="endScreen" class="screen center-screen" aria-label="Run results" hidden><div class="card"><div class="kicker" id="endKicker" hidden></div><h2 id="endTitle">ONE MORE JUMP?</h2><p id="endText" hidden></p><div class="result-score" id="endScore">0</div><div id="record"></div><div class="calm-board" id="endBoard" hidden></div><div class="result-stats"><div><b id="endCoins">0</b>coins</div><div><b id="endSeals">0 / 3</b>sun seals</div><div><b id="endDistance">0%</b>distance</div></div><button class="primary" id="againButton">Run it back <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></button><br><button class="secondary" id="titleButton">Back to the shore</button></div></section>
</main>
<script>
(() => {
'use strict';
// Everything is local: canvas art, level data, physics, and synthesized audio.
const $ = id => document.getElementById(id);
const canvas = $('world'), ctx = canvas.getContext('2d', {alpha:false});

function calmBoard(el, board){ const ui = window.Ludvig && window.Ludvig.ui; if (!el) return; if (!ui) { el.hidden = true; return; } try { if (el._calmBoard && el._calmBoard.destroy) el._calmBoard.destroy(); } catch (e) {} el._calmBoard = null; el.hidden = false; el.textContent = ''; try { el._calmBoard = ui.board(el, { board, limit: 5 }) || null; } catch (e) { el.hidden = true; } }

const storage = {get(k,f){try{return localStorage.getItem(k) ?? f;}catch{return f;}},set(k,v){try{localStorage.setItem(k,String(v));}catch{/* Private mode is playable without persistence. */}}};
let best = Number(storage.get('sunbound.best.v1','0')) || 0;
let state = 'title', run, player, solids=[],coins=[],enemies=[],items=[],seals=[],flags=[],decor=[];
let particles=[],popups=[],cam=0,oldCam=0,shake=0,flash=0,freeze=0,toastLife=0,visualTime=0;

// Web Audio: a single reusable graph; every short-lived source disconnects itself.
const audio = {
 context:null,master:null,voices:new Set(),muted:storage.get('sunbound.muted','0')==='1',beat:0,tick:0,
 unlock(){
  try{
   if(!this.context){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;

    const d=this.noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
   }
   if(this.context.state==='suspended')this.context.resume().catch(()=>{});
  }catch{/* Audio is optional when a browser blocks it. */}
 },
 tone(f,d=.12,type='triangle',volume=.15,end=f,delay=0){
  if(!this.context||this.muted||this.context.state!=='running'||this.voices.size>48)return;

 },
 noise(volume=.1,d=.09){
  if(!this.context||this.muted||this.context.state!=='running'||this.voices.size>48)return;

  s.onended=()=>{s.disconnect();f.disconnect();g.disconnect();this.voices.delete(s);};s.start(t);s.stop(t+d);
 },
 sfx(name){
  if(name==='jump')this.tone(230,.17,'square',.06,560);
  if(name==='coin'){this.tone(1050,.09,'sine',.23,1300);this.tone(1570,.16,'triangle',.11,1570,.055);}

  if(name==='win')[523,659,784,1047,988,1175,1568].forEach((f,i)=>this.tone(f,.35,'triangle',.19,f,i*.12));

 },
 music(dt){

  const melody=[0,4,7,12,7,4,2,7,4,9,12,16,14,9,7,4,5,9,12,17,12,9,7,2,4,7,11,14,12,7,4,2];

   rect(k*14-3,-6+f*k,9,5,base);rect(k*8-3,-3-f*k,8,4,base);
   rect(k*20-3,-19-f*k,8,9,base);rect(k*21-4,-22-f*k,9,6,highlight);
  }
  round(-16,-22,32,19,7,base);round(-16,-24,32,17,7,body);rect(-10,-23,20,5,highlight);
  if(hop){poly([[-13,-25],[-9,-34],[-3,-25],[3,-32],[8,-24]],'#527e70');}
  rect(-9,-29,5,9,base);rect(5,-29,5,9,base);rect(-9,-31,6,7,'#fff0ce');rect(5,-31,6,7,'#fff0ce');
  rect(-7+(e.dir>0?1:0),-29,3,4,'#294d49');rect(7+(e.dir>0?1:0),-29,3,4,'#294d49');rect(-4,-12,9,2,base);
 }
 ctx.restore();
}
function drawHero(x,y){
 const p=player;
 if(p.inv>0&&!reducedMotion&&Math.floor(visualTime*12)%2===0)ctx.globalAlpha=.42;
 if(p.power>0){
  const aura=ctx.createRadialGradient(x+13,y+20,4,x+13,y+20,45);aura.addColorStop(0,'#ffe6a766');aura.addColorStop(1,'#ffe6a700');ctx.fillStyle=aura;ctx.fillRect(x-32,y-25,90,90);
 }
 ctx.save();ctx.translate(x+13,y+38);ctx.scale(p.dir*(1+p.squash*.35),1-p.squash*.3);
 if(p.dead)ctx.rotate(-.2);
 const walking=p.grounded&&Math.abs(p.vx)>25,step=walking?Math.sin(p.walk)*4:0;
 const idle=p.grounded?Math.sin(visualTime*3)*.65:0;
 ctx.translate(0,idle);
 // The scarf, arms, and feet animate independently of the collision box.
 poly([[-6,-22],[-21-Math.abs(p.vx)*.016,-23+Math.sin(visualTime*12)*2],[-19,-17],[-7,-16]],'#da6d48');
 rect(-10,-8,8,7+step*.35,'#304e4c');rect(3,-8,8,7-step*.35,'#304e4c');
 rect(-12+step,-3,11,5,'#294b4e');rect(2-step,-3,12,5,'#294b4e');rect(-11+step,-3,8,2,'#5b7370');rect(3-step,-3,8,2,'#5b7370');
 rect(-11,-23,22,17,'#234f52');rect(-9,-23,18,15,'#428078');rect(-8,-22,5,11,'#72a391');rect(-9,-9,19,4,'#edce96');
 rect(-14,-20-step*.3,6,13,'#428078');rect(-14,-10-step*.3,6,5,'#f1c498');rect(9,-19+step*.3,6,12,'#34675f');rect(10,-9+step*.3,5,5,'#f1c498');
 rect(-11,-35,23,17,'#593e33');rect(-8,-34,21,15,'#f5c999');rect(-7,-33,18,5,'#ffdbab');rect(11,-28,5,6,'#f5c999');
 rect(-12,-38,23,9,'#714938');rect(-8,-41,15,7,'#714938');rect(-12,-35,7,10,'#714938');rect(-5,-38,14,3,'#a96944');
 rect(-13,-33,28,4,'#dd7850');rect(-12,-34,22,2,'#f4ad6b');rect(-16,-33,4,7,'#bb593e');
 const blink=!p.dead&&visualTime%6>5.87;
 rect(7,-28,3,blink?1:5,'#2b4c49');rect(8,-28,1,blink?1:2,'#fff5da');rect(6,-20,6,2,'#b57254');
 rect(-11,-20,24,5,'#e89756');rect(-8,-20,12,2,'#ffd186');rect(6,-17,5,7,'#dc784a');
 if(p.power>0){ctx.globalAlpha=.35+Math.sin(visualTime*14)*.12;rect(-10,-38,20,4,'#fff4d9');}
 ctx.restore();ctx.globalAlpha=1;
}
function drawFlag(f){
 rect(f.x,FLOOR-127,5,127,'#b9b591');rect(f.x+1,FLOOR-127,2,124,'#ede0ad');ellipse(f.x+2,FLOOR-130,5,5,'#e5c56f');
 const y=FLOOR-(f.active?122:72),wave=Math.sin(visualTime*5+f.x)*4;
 poly([[f.x+5,y],[f.x+43,y+5+wave],[f.x+35,y+17],[f.x+43,y+28+wave],[f.x+5,y+26]],f.active?'#f6cb6a':'#629586');
 if(f.active){rect(f.x+15,y+9,10,8,'#fff3c3');}else rect(f.x+16,y+10,9,6,'#a6c3a2');
 rect(f.x-7,FLOOR-5,22,5,'#7b8860');
}
function render(alpha){
 ctx.setTransform(DPR*S,0,0,DPR*S,0,0);ctx.imageSmoothingEnabled=false;
 const camera=lerp(oldCam,cam,alpha);
 background(camera);
 ctx.save();
 const amount=reducedMotion?0:shake;
 ctx.translate(-camera+(Math.random()-.5)*amount,groundLine-FLOOR+(Math.random()-.5)*amount*.65);
 const left=camera-100,right=camera+VW+100;
 for(const d of decor)if(['tree','bush','sign'].includes(d.type)&&d.x>left-100&&d.x<right+100)drawDecor(d);
 if(END>left-200&&END<right+200)lighthouse(END,FLOOR,1,state==='ending'&&run.won||state==='end'&&run.won||run.lap>=3&&state!=='title');
 for(const s of solids){
  if(!s.alive||s.x+s.w<left||s.x>right)continue;
  if(s.type==='earth')drawEarth(s,left,right);
  else if(s.type==='pipe')drawPipe(s);
  else if(s.oneWay)drawLedge(s);
  else drawBlock(s);
 }
 for(const f of flags)if(f.x>left&&f.x<right)drawFlag(f);
 for(const c of coins)if(!c.taken&&c.x>left&&c.x<right)drawCoin(c);
 for(const s of seals)if(!s.taken&&s.x>left&&s.x<right){
  const yy=s.y+15+Math.sin(visualTime*2+s.id)*5;ellipse(s.x+15,yy,29,29,'#fff0b51b');sun(s.x+15,yy,22);
 }
 for(const it of items)if(it.x>left&&it.x<right){ellipse(it.x+14,it.y+14,25,25,'#ffe5a926');sun(it.x+14,it.y+14,17);}
 for(const e of enemies)if(e.x>left&&e.x<right)drawEnemy(e);
 const px=lerp(player.px,player.x,alpha),py=lerp(player.py,player.y,alpha);
 if(player.grounded)ellipse(px+13,py+player.h+1,18,4,'#25453a26');
 drawHero(px,py);
 for(const d of decor)if(!['tree','bush','sign'].includes(d.type)&&d.x>left&&d.x<right)drawDecor(d);
 for(const p of particles){
  ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);rect(-p.size/2,-p.size/2,p.size,p.size,p.color);ctx.restore();
 }ctx.globalAlpha=1;
 for(const p of popups){
  ctx.globalAlpha=Math.min(1,p.life*3);ctx.font='800 15px ui-monospace,monospace';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#345450';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y);
 }ctx.globalAlpha=1;
 ctx.restore();
 if(run.lap>1&&state!=='title'){ctx.globalCompositeOperation='multiply';rect(0,0,VW,VH,run.lap===2?'#f6c39a':'#7d8cc0');ctx.globalCompositeOperation='source-over';}
 if(flash>0&&!reducedMotion){ctx.globalAlpha=flash*.8;rect(0,0,VW,VH,'#fff1d6');ctx.globalAlpha=1;}
 // Subtle framing, rather than heavy post-processing or expensive filters.
 const vignette=ctx.createLinearGradient(0,VH-110,0,VH);vignette.addColorStop(0,'#173f4700');vignette.addColorStop(1,'#173f4740');ctx.fillStyle=vignette;ctx.fillRect(0,VH-110,VW,110);
}
function resize(){
 W=window.innerWidth;H=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,2.5);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 S=Math.min(W/520,H/600);VW=W/S;VH=H/S;groundLine=VH*(W/H<.85?.69:.82);
 if(player){cam=oldCam=clamp(player.x-VW*.3,0,Math.max(0,END+240-VW));}
}
window.addEventListener('resize',resize);
let last=0,accumulator=0;
function frame(now){
 const dt=last?Math.min((now-last)/1000,.05):0;last=now;
 if(state==='playing'||state==='ending'){
  accumulator+=dt;let steps=0;
  while(accumulator>=STEP&&steps<7){simulate(STEP);accumulator-=STEP;steps++;if(!['playing','ending'].includes(state)){accumulator=0;break;}}
  visualTime+=dt;updateHUD();
 }else{
  accumulator=0;
  if(state==='title'){visualTime+=dt;player.walk=0;}
 }
 render(['playing','ending'].includes(state)?accumulator/STEP:1);
 requestAnimationFrame(frame);
}
reset();resize();updateMute();showScreen('title');
$('startBest').textContent=best?`PERSONAL BEST · ${best.toLocaleString()}`:'';
requestAnimationFrame(frame);
})();
</script>
