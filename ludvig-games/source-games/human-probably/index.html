 stage.innerHTML=`<div class="slide-arena">${counter()}<div class="slide-art" aria-hidden="true">${dreadArt(2)}<span class="slide-notch" id="sliderNotch"></span></div><div class="slide-track" id="sliderTrack"><span class="slide-gap" id="sliderGap"></span><button class="slide-handle" id="sliderHandle" aria-label="Slider piece. Drag into the gap, or use arrow keys and Enter.">${icon('arrow')}</button></div></div>`;
 const track=$('#sliderTrack'),handle=$('#sliderHandle'),gap=$('#sliderGap'),notch=$('#sliderNotch');R.pos=0;R.gap=.7;R.drag=null;R.nudged=false;
 const room=()=>Math.max(1,track.clientWidth-handle.offsetWidth-12);
 function draw(){handle.style.left=(6+R.pos*room())+'px';gap.style.left=(6+R.gap*room())+'px';notch.style.left=((6+R.gap*room()+handle.offsetWidth/2)/Math.max(1,track.clientWidth)*100)+'%'}
 function newGap(){R.gap=rand(.42,.95);R.nudged=false;draw()}
 newGap();R.pos=0;draw();
 function release(){if(!canPlay())return;const d=Math.abs(R.pos-R.gap)*room();if(d<=15){const p=spot(handle);sfx('good');burst(p.x,p.y,'#9cb7ff',10);say(R.good===1?'The lemon is whole again. It is still sad.':'Piece accepted. Please do not grow attached.','hurt');R.pos=0;hit(p.x,p.y);if(canPlay()){newGap();draw()}}else{mistake(R.pos<R.gap?'Not far enough. Commitment issues.':'Too far. Overachiever.',handle);R.pos=0;draw()}}
 handle.addEventListener('pointerdown',e=>{if(!canPlay()||e.button>0)return;e.preventDefault();R.drag={id:e.pointerId,x:e.clientX,start:R.pos};handle.setPointerCapture?.(e.pointerId)});
 handle.addEventListener('pointermove',e=>{if(!R.drag||R.drag.id!==e.pointerId||!canPlay())return;R.pos=clamp(R.drag.start+(e.clientX-R.drag.x)/room(),0,1);if(S.index>0&&R.good===2&&!R.nudged&&Math.abs(R.pos-R.gap)<.12&&R.gap>.55){R.nudged=true;R.gap=clamp(R.gap+(R.gap>.8?-.22:.15),.4,.97);say('The gap got nervous and moved.','neutral')}draw()});
 const up=e=>{if(!R.drag||R.drag.id!==e.pointerId)return;R.drag=null;release()};
 handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',()=>{R.drag=null;R.pos=0;draw()});
 active.onKey=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();R.pos=clamp(R.pos+(e.key==='ArrowRight'?.03:-.03),0,1);draw()}else if([' ','Enter'].includes(e.key)&&!e.repeat){e.preventDefault();release()}};

}
function mountLetters(){
 const words=['MEOW','BEEP','SOUP','NOPE','DUCK','HELP','OOPS','TOAST','WIFI','SNACK','TAXES','NAPS'];
 const order=words.slice().sort(()=>Math.random()-.5);R.words=order;R.w=0;R.k=0;
 stage.classList.add('dots');
 stage.innerHTML=`<div class="letters-arena">${counter()}<div class="letters-word" id="lettersWord" aria-live="polite"></div><div class="letters-pad" id="lettersPad" role="group" aria-label="Letters"></div></div>`;
 const wordEl=$('#lettersWord'),pad=$('#lettersPad');
 function render(){const w=R.words[R.w];wordEl.dataset.next=w[R.k]||'';wordEl.setAttribute('aria-label','Type '+w.split('').join(' '));wordEl.innerHTML=w.split('').map((c,i)=>`<span class="${i<R.k?'done':''}" style="rotate:${Math.round(rand(-18,18))}deg;translate:0 ${Math.round(rand(-7,7))}px">${c}</span>`).join('')}
 function newPad(){const w=R.words[R.w];const set=[...new Set(w.split(''))];const pool='ABCDEFGHJKLMNPRSTUVWXYZ'.split('').filter(c=>!set.includes(c)).sort(()=>Math.random()-.5);const keysOn=set.concat(pool.slice(0,Math.max(2,8-set.length))).sort(()=>Math.random()-.5);pad.innerHTML=keysOn.map(c=>`<button class="letter-key" data-key="${c}">${c}</button>`).join('');$$('[data-key]').forEach(b=>b.addEventListener('click',()=>press(b.dataset.key,b)))}
 function press(c,b){if(!canPlay())return;const w=R.words[R.w];if(c===w[R.k]){R.k++;sfx('tap',R.k);if(b)bump(b);if(R.k>=w.length){const p=spot(wordEl);say(choose(['Spelling: technically human.','A real word. From a real hand.','We will pretend that was effortless.']),'hurt');R.w++;R.k=0;hit(p.x,p.y,0,'LEGIBLE.');if(canPlay()){render();newPad()}}else render()}else mistake(choose(['That letter is a different letter.','Close. Wrong alphabet.','Robots also miss sometimes. Allegedly.']),b)}
 render();newPad();
 active.onKey=e=>{if(/^[a-z]$/i.test(e.key)){e.preventDefault();const c=e.key.toUpperCase();press(c,$(`[data-key="${c}"]`))}};
}
function mountRotate(){
 const pics=[duckSvg(),ghostSvg().replace(' id="ghost"',''),bossSvg(0),cookieSvg()];const names=['Gerald','the ghost','the robot','a cookie'];
 R.turns=pics.map(()=>choose([90,180,270]));R.drift=2.4;
 stage.innerHTML=`<div class="rotate-arena">${counter()}<div class="rotate-grid">${pics.map((s,i)=>`<button class="rotate-tile" data-turn="${i}" aria-label="Rotate ${names[i]}"><span class="rotate-pic" style="rotate:${R.turns[i]}deg">${s}</span></button>`).join('')}</div></div>`;
 function turn(i){if(!canPlay())return;const b=$(`[data-turn="${i}"]`);if(!b||b.disabled)return;R.turns[i]+=90;b.firstElementChild.style.rotate=R.turns[i]+'deg';sfx('tap',R.good);if(R.turns[i]%360===0){b.disabled=true;b.classList.add('upright');const p=spot(b);say(i===0?'Gerald is upright. Emotionally, still sideways.':choose(['Gravity approves.','That is the right way up. Probably.','Up is up. We checked.']),'hurt');hit(p.x,p.y,0,'UPRIGHT.')}}
 $$('[data-turn]').forEach(b=>b.addEventListener('click',()=>turn(+b.dataset.turn)));
 active.update=dt=>{R.drift-=dt;if(R.drift<=0){R.drift=S.mode==='turbo'?1.9:2.6;const open=$$('[data-turn]').filter(b=>!b.disabled);if(open.length>1){const b=choose(open),i=+b.dataset.turn;R.turns[i]+=90;if(R.turns[i]%360===0)R.turns[i]+=90;b.firstElementChild.style.rotate=R.turns[i]+'deg';say('One of them is spinning on purpose.','neutral')}}};
 active.onKey=e=>{if(/^[1-4]$/.test(e.key)){e.preventDefault();turn(+e.key-1)}};
}
function mountHold(){
 stage.innerHTML=`<div class="hold-arena">${counter()}<button class="hold-btn" id="holdBtn" aria-label="Press and hold. Let go when the ring reaches green."><span class="hold-ring" id="holdRing" aria-hidden="true"></span><span class="hold-label" id="holdLabel">Hold</span></button></div>`;
 const btn=$('#holdBtn'),ring=$('#holdRing'),label=$('#holdLabel');R.fill=0;R.holding=false;R.pid=null;
 function newWindow(){R.lo=rand(.5,.78);R.hi=R.lo+.15;btn.dataset.lo=R.lo.toFixed(3);btn.dataset.hi=R.hi.toFixed(3)}
 function draw(){btn.dataset.fill=R.fill.toFixed(3);ring.style.background=`conic-gradient(transparent ${R.lo*360}deg,#3d7755b3 ${R.lo*360}deg ${R.hi*360}deg,transparent ${R.hi*360}deg),conic-gradient(var(--blue) ${R.fill*360}deg,#e3e9da 0)`;const inside=R.fill>=R.lo&&R.fill<=R.hi;btn.classList.toggle('green',inside);label.textContent=R.holding?(inside?'Now!':'Hold…'):'Hold'}
 newWindow();draw();
 function start(){if(!canPlay()||R.holding)return;R.holding=true;R.fill=0;sfx('tap');draw()}
 function stop(){if(!R.holding)return;R.holding=false;if(!canPlay()){R.fill=0;draw();return}if(R.fill>=R.lo&&R.fill<=R.hi){const p=spot(btn);sfx('good');say(choose(['Patience detected. Unusual.','A perfectly human amount of waiting.','You let go at the right time. Rare.']),'hurt');R.fill=0;newWindow();draw();hit(p.x,p.y,0,'PATIENT.')}else{mistake(R.fill<R.lo?'Too eager. Robots are eager.':'Too patient. Suspiciously patient.',btn);R.fill=0;newWindow();draw()}}
 btn.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();R.pid=e.pointerId;btn.setPointerCapture?.(e.pointerId);start()});
 btn.addEventListener('pointerup',e=>{if(R.pid!==e.pointerId)return;R.pid=null;stop()});
 btn.addEventListener('pointercancel',()=>{R.pid=null;R.holding=false;R.fill=0;draw()});
 btn.addEventListener('contextmenu',e=>e.preventDefault());
 const ku=e=>{if([' ','Enter'].includes(e.key))stop()};document.addEventListener('keyup',ku);
 active.update=dt=>{if(!R.holding)return;R.fill+=dt/(S.mode==='turbo'?1.15:1.45);if(R.fill>=1){R.fill=1;R.holding=false;mistake('Too patient. Suspiciously patient.',btn);R.fill=0;newWindow()}draw()};
 active.onKey=e=>{if([' ','Enter'].includes(e.key)&&!e.repeat){e.preventDefault();start()}};
 active.dispose=()=>{document.removeEventListener('keyup',ku);R.holding=false};
}
function showResult(){
 S.phase='result';document.body.classList.add('is-result');keys.clear();active={};stage.className='stage';$('#banner').hidden=true;$('#timeTrack').hidden=true;$('#chromeStatus').textContent='HUMANITY: SUFFICIENT';const won=S.results.filter(r=>r.won).length;const newBest=S.score>best[S.mode];if(newBest){best[S.mode]=S.score;try{localStorage.setItem('human-probably-v2-best',JSON.stringify(best))}catch{}}
 const bossWon=S.results.at(-1)?.won;
 stage.innerHTML=`<div class="result"><h2>Human, <em>definitely.</em></h2><div class="final-score">${S.score.toLocaleString('en-US')}</div><p class="result-best">${newBest?'NEW BEST':'BEST '+best[S.mode].toLocaleString('en-US')} · ${won}/7 CLEARED${S.mode==='turbo'?' · OVERTIME':''}</p><div class="result-medals" aria-label="Round results">${S.results.map((r,i)=>`<span class="medal ${r.won?'':'missed'}" title="${S.run[i].label}: ${r.won?r.rating+' stars':'moving on'}" aria-label="${S.run[i].label}: ${r.won?r.rating+' stars':'not cleared'}">${r.won?icon('check'):icon('dash')}</span>`).join('')}</div><div class="lg-board" id="resultBoard" hidden></div><div class="result-actions"><button class="primary" id="replayBtn">Play again ${icon('repeat')}</button><button class="secondary" id="turboBtn">${S.mode==='turbo'?'Back to normal':'Again, but faster'}</button></div><div class="result-share"><button id="shareBtn">Challenge a friend</button><button id="saveBtn">Save scorecard</button></div></div>`;
 lgBoard($('#resultBoard'),lgId());$('#replayBtn').addEventListener('click',()=>startGame(S.mode));$('#turboBtn').addEventListener('click',()=>startGame(S.mode==='turbo'?'normal':'turbo'));$('#shareBtn').addEventListener('click',share);$('#saveBtn').addEventListener('click',saveCard);say(bossWon?'Gerald has been promoted to Head of Security.':'Gerald has approved your humanity. Good enough.','happy');$('#pauseBtn').disabled=true;sfx('final');burst(stage.clientWidth*.25,70,'#d9ba6c',22);burst(stage.clientWidth*.75,70,'#9eb6f7',22);$('#replayBtn').focus({preventScroll:true});updateHud();
}
function resultText(){return `Human, Probably\n${S.score.toLocaleString('en-US')} points · ${S.results.filter(r=>r.won).length}/7 tests · ${Math.round(S.totalTime)}s${S.mode==='turbo'?' · OVERTIME':''}\nI made the CAPTCHA question its own existence.\nYour turn.`}
async function share(){const web=/^https?:$/.test(location.protocol)&&!['localhost','127.0.0.1'].includes(location.hostname);const text=resultText();const payload={title:'Human, Probably',text,...(web?{url:location.href.split('#')[0]}:{})};if(navigator.share){try{await navigator.share(payload);return}catch(e){if(e.name==='AbortError')return}}const full=text+(web?'\n'+payload.url:'');try{await navigator.clipboard.writeText(full);toast('Score copied.')}catch{openModal('Challenge a friend.',`<p>Copy your score below.</p><textarea id="shareText" aria-label="Share your score" readonly>${esc(full)}</textarea>`,[{text:'Done',fn:closeModal}]);$('#shareText').select()}}
function saveCard(){
 try{const c=document.createElement('canvas');c.width=1080;c.height=1080;const g=c.getContext('2d');g.fillStyle='#f4f4ef';g.fillRect(0,0,1080,1080);g.fillStyle='#c5ceba';for(let x=0;x<1080;x+=14)for(let y=0;y<1080;y+=14)g.fillRect(x,y,1,1);g.fillStyle='#fff';g.fillRect(76,155,928,820);g.strokeStyle='#d2dbc5';g.strokeRect(76,155,928,820);g.fillStyle='#315af3';g.fillRect(76,155,928,84);g.fillStyle='#fff';g.font='22px monospace';g.fillText(S.results.at(-1)?.won?'SYSTEM OVERRULED. NO APPEALS.':'HUMANITY: GOOD ENOUGH.',119,207);g.fillStyle='#293220';g.font='bold 31px Arial';g.fillText('human, probably.',76,93);g.textAlign='center';g.font='bold 72px Arial';g.fillText('Human, definitely.',540,390);g.font='italic 68px Georgia';g.fillText('System? Questionable.',540,476);g.fillStyle='#315af3';g.font='bold 132px monospace';g.fillText(S.score.toLocaleString('en-US'),540,660);g.fillStyle='#7c8a6b';g.font='23px monospace';g.fillText(`${S.results.filter(r=>r.won).length}/7 TESTS  ·  ${Math.round(S.totalTime)}s  ·  ${S.mode==='turbo'?'OVERTIME':'NORMAL'}`,540,730);g.save();g.translate(540,849);g.rotate(-.055);g.strokeStyle='#7f9c68';g.lineWidth=3;g.strokeRect(-274,-32,548,67);g.fillStyle='#66834f';g.font='bold 27px monospace';g.fillText('THE SYSTEM HAS A SKILL ISSUE.',0,11);g.restore();g.fillStyle='#738264';g.font='20px monospace';g.fillText('CAN YOU MAKE THE CAPTCHA QUESTION ITSELF?',540,1030);c.toBlob(blob=>{if(!blob){toast('Scorecard export failed. Use the share button.');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='human-probably-score.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')}catch{toast('Scorecard export failed. Use the share button.')}
}
function openModal(title,content,actions=[{text:'Back to it',fn:closeModal}]){if(!$('#modalBackdrop').hidden)return;lastFocus=document.activeElement;S.paused=true;keys.clear();document.body.classList.add('frozen');$('#modal').innerHTML=`<h2 id="modalTitle">${title}</h2>${content}<div class="modal-actions">${actions.map((a,i)=>`<button class="${i===0?'primary':'secondary'}" data-modal="${i}">${a.text}</button>`).join('')}</div>`;$('#modalBackdrop').hidden=false;actions.forEach((a,i)=>$(`[data-modal="${i}"]`).addEventListener('click',a.fn));$('[data-modal="0"]').focus({preventScroll:true})}
function closeModal(){if($('#modalBackdrop').hidden){S.paused=false;return}$('#modalBackdrop').hidden=true;S.paused=false;document.body.classList.remove('frozen');last=performance.now();keys.clear();if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});lastFocus=null}
function pause(){if(S.phase==='home'||S.phase==='result')return;openModal('Paused',`<small>Miss a test and the run moves on. Fast, clean clears build your multiplier.</small>`,[{text:'Resume',fn:closeModal},{text:'Restart run',fn:()=>startGame(S.mode)},...(lgReady()?[{text:TROPHY+'<span class="sr-only">Leaderboard</span>',fn:e=>{e.stopPropagation();lgOpen(lgId())}}]:[])])}
function help(){openModal('How to play',`<p>Clear seven quick tests. Your correct answers count the first time. Miss one and the run keeps moving.</p><p>Fast clears earn a bonus. Clean rounds earn extra points. Every two cleared rounds increase your multiplier, up to ×4. Mistakes break the streak.</p><small class="kbd-only">1–9 select tiles. Space locks a soul or stamps the robot. Arrow keys move the duck. Select a contract with 1–3, then press Enter to shred it. 1–3 close meeting windows. Esc pauses.</small>`,[{text:'Back to it',fn:closeModal},{text:'Privacy',fn:()=>{closeModal();privacy()}}])}
function privacy(){openModal('A game. Not a data harvest.',`<p>No analytics, accounts, microphones, or cameras. This is a fictional CAPTCHA.</p><p>Finished scores go to the public leaderboard under your nickname.</p><p>Only your best scores and sound preference are saved in this browser, when local storage is available.</p>`,[{text:'Back to the game',fn:closeModal},{text:'Clear saved data',fn:()=>{try{localStorage.removeItem('human-probably-v2-best');localStorage.removeItem('human-probably-best');localStorage.removeItem('human-probably-sound')}catch{}best={normal:0,turbo:0};closeModal();toast('Saved scores and sound preference cleared.')}}])}
$('#chromeTitle').innerHTML=icon('repeat')+'unCAPTCHA';$('#pauseBtn').innerHTML=icon('pause');$('#helpBtn').innerHTML=icon('help');$('#soundBtn').addEventListener('click',()=>{sound=!sound;try{localStorage.setItem('human-probably-sound',sound?'on':'off')}catch{}if(sound)unlockAudio();updateSound();sfx()});$('#pauseBtn').addEventListener('click',pause);$('#helpBtn').addEventListener('click',help);$('#privacyBtn').addEventListener('click',privacy);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(!$('#modalBackdrop').hidden){if(e.key==='Escape'){e.preventDefault();closeModal();return}if(e.key==='Tab'){const f=$$('#modal button,#modal textarea'),first=f[0],lastEl=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();lastEl.focus()}else if(!e.shiftKey&&document.activeElement===lastEl){e.preventDefault();first.focus()}}return}
 if(e.key==='Escape'){e.preventDefault();pause();return}
 if(S.phase==='between'&&['Enter',' '].includes(e.key)){e.preventDefault();if(S.between>.25)nextRound();return}
 if(!canPlay()||e.repeat&& !['ArrowLeft','ArrowRight','a','d'].includes(e.key))return;
 if(e.target.closest('.topbar,.footer'))return;active.onKey?.(e);
});
document.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden&&['playing','between'].includes(S.phase)&&!S.paused)pause()});
function tick(now){
 const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 if(!S.paused&&!document.hidden){if(S.phase==='playing'){
  $('#pauseBtn').disabled=false;R.t+=dt;S.totalTime+=dt;R.grace=Math.max(0,R.grace-dt);if(R.grace<=0)R.elapsed+=dt;
  active.update?.(dt);
  if(S.phase==='playing'){const remain=Math.max(0,R.duration-R.elapsed);$('#timer').textContent=Math.ceil(remain)+'s';$('#timeFill').style.transform=`scaleX(${remain/R.duration})`;$('#timeFill').classList.toggle('urgent',remain<=3);if(remain<=0)finishRound(false)}
 }else if(S.phase==='between'){S.between+=dt;S.totalTime+=dt;if(S.between>1.15)nextRound()}}
 requestAnimationFrame(tick);
}
// Read-only diagnostics for the included interaction tests. No stage-skip or score-writing API.
Object.defineProperty(window,'humanProbably',{value:Object.freeze({snapshot:()=>({phase:S.phase,paused:S.paused,between:S.between,index:S.index,score:S.score,combo:S.combo,mode:S.mode,results:S.results.map(r=>({...r})),round:{id:R.id,good:R.good,goal:R.goal,errors:R.errors,elapsed:R.elapsed,duration:R.duration,position:R.position,center:R.center,width:R.width,player:R.player,items:R.items?.map(i=>({x:i.x,y:i.y,bot:i.bot}))}})}),writable:false});
updateSound();home();requestAnimationFrame(tick);

})();
