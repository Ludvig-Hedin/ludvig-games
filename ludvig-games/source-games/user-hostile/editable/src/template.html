<body>
<header class="titlebar"><div class="title-left"><span class="title-icon">!</span><span class="short-title">userhostile.exe</span></div><div class="title-actions"><div id="deadline-pill" class="deadline-pill hidden" role="timer" aria-label="Time remaining to finish the form"><small>EXPIRES</small><b id="deadline-mini">05:00</b></div><button id="sound-top" title="Sound (M)">SOUND: ON</button><button id="pause-top" title="Pause and honest help (Esc)" aria-label="Pause and honest help" class="icon-btn"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg></button><button id="board-top" class="board-top" aria-label="Leaderboard" title="Leaderboard" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg></button></div></header>
<div id="bg3d" aria-hidden="true"></div><div class="grid-ground" aria-hidden="true"></div><div class="fallback-torus" aria-hidden="true"></div>
<main id="main"><div class="brand"><div class="brand-name">User<span class="hostile">Hostile</span></div></div><div id="hud" class="hidden"><div class="status-area"><div class="timer"><span id="timer-value" role="timer" aria-live="off">05:00</span><small>UNTIL YOUR FORM EXPIRES</small></div><div class="rage"><small>PATIENCE REMAINING</small><div class="rage-track"><div id="rage-fill" class="rage-fill"></div></div></div></div><nav id="steps" class="steps" aria-label="Decorative progress"></nav></div><div id="view"></div></main>
<aside id="support" class="window hidden" aria-label="Fictional unhelpful assistant"><div class="window-title support-title"><span>✦ Need less help?</span><div class="win-buttons"><button id="support-expand" title="Close support">×</button></div></div><div class="support-body"><div class="support-top"><div class="bot-face" aria-hidden="true"></div><div class="support-meta"><div class="support-name">CLIFF · Support-ish</div>● Online. Emotionally unavailable.</div></div><p class="bot-msg" id="bot-msg">Hi! I see you're trying to do something. Have you tried not doing that?</p><textarea id="chat-input" placeholder="Describe your problem in 3 words or 3,000." maxlength="200" aria-label="Message the fictional support bot"></textarea><div class="support-actions"><button class="link tiny" id="support-hide">send to bottom</button><button class="retro tiny" id="support-send">Send ↑</button></div></div></aside>
<button id="support-tab" class="hidden"><span class="notification-dot"></span>1 new inconvenience</button>
<section id="cookie" class="hidden" aria-label="Imaginary cookie consent"></section>
<div id="ads-layer" aria-label="Fictional advertisements"></div><div id="timeout-root"></div><div id="toasts" class="toast-stack" aria-live="polite"></div><div id="modal-root"></div><div id="pause-root"></div>
<footer class="safety-bar"><button class="start-windows" id="taskbar-start"><span class="start-logo"></span>Finish</button><div class="safe-controls"><button id="safety-help"><span class="key-hint">Esc · </span>Pause & honest help</button><button id="safety-motion">Motion: on</button></div></footer>
<noscript><div style="position:fixed;inset:30%;z-index:999;background:white;padding:30px">The one actual requirement: enable JavaScript to play.</div></noscript>
<script>/*__GAME__*/</script>
