<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/assets/ludvig.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f1ea">
<title>Six Clues</title>
<meta name="description" content="One secret country a day. Six clues, from hard to easy. How few do you need?">
<style>
  :root {
    --bg: #f5f1ea; --card: #fffdf8; --ink: #1e2227; --muted: #6c6f74; --faint: #a9a49b;
    --line: #e5ded1; --soft: #ece5d8; --accent: #2c6b5e; --accent-ink: #fff;
    --good: #2f8a5f; --good-soft: #dcefe3; --bad: #c4543c; --bad-soft: #f6e0d9;
    --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius: 16px; --shadow: 0 1px 0 rgba(30, 34, 39, .04), 0 6px 20px -12px rgba(30, 34, 39, .25);
    --dock: 168px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1e2125; --ink: #ecebe6; --muted: #9c9fa4; --faint: #61656b;
      --line: #2c3035; --soft: #262a2f; --accent: #6cc3ad; --accent-ink: #0f1a17;
      --good: #5cc28f; --good-soft: #1e3329; --bad: #e98066; --bad-soft: #3a2420;
      --shadow: 0 1px 0 rgba(0, 0, 0, .2), 0 8px 24px -14px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; max-width: 100%; overflow-x: hidden; overflow-x: clip; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 8px; height: 56px; }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 20px; letter-spacing: .14em; margin-right: auto; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .icon { width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: grid; place-items: center; color: var(--ink); }
  .icon:hover { background: var(--soft); }
  .icon svg { width: 22px; height: 22px; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; margin-left: 4px; }
  .lang button { border: 0; background: transparent; font-size: 12px; font-weight: 700; letter-spacing: .06em; padding: 7px 10px; border-radius: 999px; color: var(--muted); min-width: 38px; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  /* Mode tabs and meta */
  .modes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; background: var(--soft); padding: 4px; border-radius: 14px; margin: 16px 0 12px; }
  .modes button { border: 0; background: transparent; padding: 10px; border-radius: 10px; font-weight: 600; color: var(--muted); min-height: 44px; transition: background .2s, color .2s; }
  .modes button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 2px 14px; color: var(--muted); font-size: 14px; }
  .pips { display: flex; gap: 5px; }
  .pip { width: 22px; height: 6px; border-radius: 3px; background: var(--line); transition: background .35s, transform .35s; }
  .pip.used { background: var(--bad); }
  .pip.win { background: var(--good); transform: scaleY(1.4); }
  .pip.now { background: var(--ink); }
  .pip.pop { animation: pip .45s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pip { 0% { transform: scaleY(1); } 40% { transform: scale(1.25, 2.2); } 100% { transform: none; } }
  .pip.win.pop { animation-name: pipwin; }
  @keyframes pipwin { 0% { transform: scaleY(1); } 40% { transform: scale(1.3, 2.6); } 100% { transform: scaleY(1.4); } }

  /* Clues */
  main { padding-bottom: calc(var(--dock) + env(safe-area-inset-bottom) + 24px); }
  main.done { padding-bottom: 48px; }
  ol.clues { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; perspective: 900px; }
  .clue { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 14px 16px 15px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); transform-origin: 50% 0; }
  .clue-num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--soft); color: var(--ink); }
  .clue-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 4px; }
  .clue-text { margin: 0; font-family: var(--serif); font-size: 18px; line-height: 1.42; text-wrap: pretty; }
  .clue-guess { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .clue-guess.bad { background: var(--bad-soft); color: var(--bad); }
  .clue-guess.good { background: var(--good-soft); color: var(--good); }
  .clue.locked { background: transparent; box-shadow: none; border-style: dashed; padding-top: 12px; padding-bottom: 12px; }
  .clue.locked .clue-num { background: transparent; border: 1px dashed var(--faint); color: var(--faint); }
  .clue.locked .clue-label { color: var(--faint); margin: 7px 0 0; }
  .clue.extra { opacity: .62; box-shadow: none; }
  .clue.current .clue-num { background: var(--ink); color: var(--bg); }
  .clue.solved { border-color: var(--good); box-shadow: 0 0 0 3px var(--good-soft), var(--shadow); }
  .clue.solved .clue-num { background: var(--good); color: #fff; }
  .clue.solved.just { animation: solved .7s cubic-bezier(.2, 1.3, .4, 1); }
  @keyframes solved { 0% { transform: scale(1); } 35% { transform: scale(1.025); } 100% { transform: none; } }
  .clue-guess.just { animation: chip .5s cubic-bezier(.36, .07, .19, .97); }
  @keyframes chip { 0% { opacity: 0; transform: translateY(-4px) scale(.9); } 30% { opacity: 1; transform: translateX(-4px); } 50% { transform: translateX(4px); } 70% { transform: translateX(-2px); } 100% { transform: none; } }
  .clue.reveal { animation: reveal .62s cubic-bezier(.2, .85, .25, 1) both; }
  .clue.reveal .clue-text { animation: ink .9s .12s ease both; }
  @keyframes reveal { from { opacity: 0; transform: rotateX(-68deg) translateY(-6px); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }
  @keyframes ink { from { opacity: 0; filter: blur(6px); letter-spacing: .02em; } to { opacity: 1; filter: none; letter-spacing: normal; } }

  /* Dock */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); background: linear-gradient(to top, var(--bg) 78%, color-mix(in srgb, var(--bg) 0%, transparent)); padding: 18px 0 calc(12px + env(safe-area-inset-bottom)); }
  .dock[hidden] { display: none; }
  .field { position: relative; display: flex; gap: 8px; }
  .field input { flex: 1; min-width: 0; height: 54px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); padding: 0 16px; font-size: 17px; font-family: var(--sans); box-shadow: var(--shadow); -webkit-appearance: none; appearance: none; }
  .field input:focus { border-color: var(--accent); outline: none; }
  .btn { height: 54px; border-radius: 14px; border: 0; padding: 0 20px; font-weight: 700; font-size: 16px; background: var(--accent); color: var(--accent-ink); transition: transform .12s, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .45; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.wide { width: 100%; }
  .skip { margin-top: 8px; width: 100%; height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: transparent; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .skip small { color: var(--muted); font-weight: 500; }
  .skip.warn { border-color: var(--bad); color: var(--bad); }
  .shake { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .sugg { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); margin: 0; padding: 6px; list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 40px -12px rgba(0, 0, 0, .35); max-height: 46vh; overflow: auto; }
  .sugg[hidden] { display: none; }
  .sugg li { display: flex; align-items: baseline; gap: 8px; padding: 12px 12px; border-radius: 10px; cursor: pointer; min-height: 46px; font-size: 16px; }
  .sugg li small { color: var(--muted); font-size: 13px; }
  .sugg li.active, .sugg li:hover { background: var(--soft); }
  .sugg li.used { color: var(--faint); text-decoration: line-through; }

  /* Result */
  .result { margin-top: 18px; padding: 26px 20px 22px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); text-align: center; animation: pop .6s cubic-bezier(.2, 1.3, .4, 1) both; }
  .result[hidden] { display: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  .flag { font-size: 64px; line-height: 1; display: inline-block; animation: wave 1.2s .25s ease both; }
  @keyframes wave { 0% { transform: scale(.4) rotate(-12deg); opacity: 0; } 55% { transform: scale(1.12) rotate(4deg); opacity: 1; } 100% { transform: none; } }
  .kicker { margin: 14px 0 2px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .kicker.win { color: var(--good); }
  .result h2 { font-family: var(--serif); font-size: 32px; margin: 2px 0 2px; }
  .cap { margin: 0 0 14px; color: var(--muted); }
  .grid { font-size: 22px; letter-spacing: 3px; margin: 6px 0 18px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .next { margin: 16px 0 0; color: var(--muted); font-size: 14px; }
  .next b { font-variant-numeric: tabular-nums; color: var(--ink); font-size: 16px; }

  /* Dialogs */
  dialog { border: 0; padding: 0; border-radius: 22px; background: var(--card); color: var(--ink); width: min(440px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); box-shadow: 0 24px 80px -20px rgba(0, 0, 0, .5); }
  dialog::backdrop { background: rgba(20, 22, 25, .45); backdrop-filter: blur(3px); }
  dialog[open] { animation: pop .35s cubic-bezier(.2, 1.1, .4, 1) both; }
  .dlg { padding: 22px 22px 20px; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .dlg-head h2 { margin: 0; font-family: var(--serif); font-size: 24px; }
  .dlg p { line-height: 1.5; margin: 0 0 12px; }
  .dlg ol.rules { margin: 0 0 14px; padding-left: 20px; line-height: 1.5; }
  .dlg ol.rules li { margin-bottom: 6px; }
  .example { font-size: 20px; letter-spacing: 2px; background: var(--soft); border-radius: 12px; padding: 10px 12px; margin: 4px 0 14px; }
  .example small { display: block; font-size: 13px; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin: 8px 0 18px; }
  .nums b { display: block; font-size: 28px; font-family: var(--serif); }
  .nums span { font-size: 12px; color: var(--muted); }
  .hist h3, .dlg h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
  .bar-fill { height: 24px; min-width: 26px; border-radius: 6px; background: var(--soft); color: var(--ink); display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; font-size: 13px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
  .bar-fill.hot { background: var(--good); color: #fff; }
  .archive { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin: 6px 0 14px; max-height: 50vh; overflow: auto; }
  .day { border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; background: transparent; min-height: 64px; }
  .day b { display: block; font-size: 16px; }
  .day span { font-size: 12px; color: var(--muted); }
  .day.today { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .day[disabled] { cursor: default; opacity: .55; }
  .note { font-size: 14px; color: var(--muted); }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 150px); transform: translate(-50%, 12px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .dock[hidden] ~ .toast { bottom: calc(env(safe-area-inset-bottom) + 24px); }
  .toast.bad { background: var(--bad); color: #fff; }
  canvas.fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .error { margin: 40px 0; text-align: center; color: var(--muted); }

  .ui-i { width: 14px; height: 14px; flex: none; vertical-align: -2px; }
  .day .ui-i { width: 12px; height: 12px; margin-right: 3px; }
  .row > span { display: flex; align-items: center; }
  .lg-board { margin: 0 auto 16px; max-width: 100%; text-align: left; font-size: 14px; }
  .lg-board:empty { display: none; }
  .dlg-head .icon + .icon { margin-left: -4px; }
  .dlg-head .tools { display: flex; align-items: center; }
  @media (max-width: 480px) { .modes { margin: 10px 0 8px; } .meta { margin-bottom: 10px; } }
  @media (max-width: 680px) {
    body:has(> a[aria-label="All games"]) .bar { padding-left: 56px; gap: 0; }
    body:has(> a[aria-label="All games"]) .brand { font-size: 17px; letter-spacing: .06em; }
    body:has(> a[aria-label="All games"]) .icon { width: 42px; flex-shrink: 0; }
  }
  @media (max-width: 380px) {
    body:has(> a[aria-label="All games"]) .bar { padding-left: 52px; }
    body:has(> a[aria-label="All games"]) .brand { font-size: 15px; letter-spacing: .03em; }
    body:has(> a[aria-label="All games"]) .icon { width: 38px; }
  }
  @media (max-width: 380px) {
    .bar { gap: 2px; }
    .brand { font-size: 16px; letter-spacing: .06em; }
    .icon { width: 40px; flex-shrink: 0; }
    .lang { margin-left: 2px; }
    .lang button { min-width: 30px; padding: 7px 6px; }
  }
  @media (min-width: 600px) { .clue-text { font-size: 19px; } .brand { font-size: 22px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand" aria-label="Six Clues">Six <span>Clues</span></div>
    <button class="icon" id="btnHelp" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4"/><circle cx="12" cy="17.6" r=".6" fill="currentColor"/></svg></button>
    <button class="icon" id="btnArchive" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    <button class="icon" id="btnStats" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-5"/></svg></button>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="sv" aria-pressed="false">SV</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="modes" role="tablist">
    <button type="button" role="tab" id="tabDaily" aria-selected="true"></button>
    <button type="button" role="tab" id="tabPractice" aria-selected="false"></button>
    <button type="button" role="tab" id="tabFriends" aria-selected="false" hidden></button>
  </div>
  <div class="meta" id="metaRow"><span id="metaText"></span><div class="pips" id="pips" aria-hidden="true"></div></div>
  <ol class="clues" id="clues" aria-live="polite"></ol>
  <section class="result" id="result" hidden aria-live="polite"></section>
  <section id="friends" hidden></section>
</main>

<div class="dock" id="dock">
  <div class="wrap">
    <form class="field" id="form" autocomplete="off">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul>
      <label class="sr" for="guess" id="guessLabel"></label>
      <input id="guess" type="text" role="combobox" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="btn" id="btnGuess" type="submit"></button>
    </form>
    <button class="skip" id="btnSkip" type="button"></button>
  </div>
</div>

<dialog id="dlgHelp"><div class="dlg" id="helpBody"></div></dialog>
<dialog id="dlgStats"><div class="dlg" id="statsBody"></div></dialog>
<dialog id="dlgArchive"><div class="dlg" id="archiveBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="countries.js"></script>
<script src="friends.js"></script>
<script>
(function () {
  'use strict';
  var S = window.SixClues;
  if (!S) {
    document.getElementById('main').innerHTML = '<p class="error">The puzzle could not load. Please refresh the page.</p>';
    document.getElementById('dock').hidden = true;
    return;
  }

  // UI icons: simple 2 px stroke SVGs that follow the text colour.
  var SVG = '<svg class="ui-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var ICON = { check: SVG + '<path d="M5 12.5l4.5 4.5L19 7"/></svg>', cross: SVG + '<path d="M6 6l12 12M18 6L6 18"/></svg>', lock: SVG + '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>' };

  var T = {

      giveUp: 'Give up', confirm: 'Tap again to give up', skipped: 'Skipped', pick: 'Pick a country from the list',
      already: 'You already guessed that', notIt: function (n) { return 'Not ' + n; },

      capital: function (c) { return 'Capital: ' + c; }, noCap: 'A city-state',
      share: 'Share', copied: 'Result copied', copyFail: 'Could not copy the result', stats: 'Statistics', another: 'Another country',
      nextIn: 'Next country in', played: 'Played', win: 'Win %', streak: 'Streak', best: 'Best streak', dist: 'Clues needed',
      help: 'How to play', archive: 'Archive', close: 'Close', play: 'Play', locked: 'Locked', todayShort: 'Today',
      archiveNote: 'Earlier days are locked for now. The daily country is only playable on its own day.',
      helpBody: '<p>There is one secret country each day, the same for everyone.</p><ol class="rules"><li>You start with one clue. Clues go from hard to easy.</li><li>Type a country and pick it from the list to guess.</li><li>A wrong guess, or <b>Next clue</b>, reveals the next clue.</li><li>Find it with as few clues as you can. Six is the limit.</li></ol><div class="example">🟥🟥🟩⬜⬜⬜<small>Solved on the third clue</small></div><p>A new country arrives at midnight, Swedish time. <b>Practice</b> gives you random countries any time, without touching your streak.</p>',
      gotIt: 'Let’s play', notNeeded: 'Not needed'
    },
    sv: {

      meta: function (n, d) { return '#' + n + ' · ' + d; }, practiceMeta: 'Träning · påverkar inte statistiken',
      placeholder: 'Skriv ett land…', guessLabel: 'Din gissning', guess: 'Gissa', next: 'Nästa ledtråd', nextSmall: '+1 ledtråd',

  $('guess').addEventListener('keydown', function (e) {
    if ($('sugg').hidden) return;
    if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.min(sugg.length - 1, active + 1); highlight(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.max(0, active - 1); highlight(); }
    else if (e.key === 'Escape') { hideSuggestions(); }
  });
  $('sugg').addEventListener('mousedown', function (e) { e.preventDefault(); });
  $('sugg').addEventListener('click', function (e) { var li = e.target.closest('li'); if (li) choose(Number(li.dataset.i)); });
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var exact = S.match($('guess').value);
    if (exact) return submitGuess(exact);
    if (!$('sugg').hidden && sugg[active]) return choose(active);
    submitGuess(null);
  });

  // Daily rollover at midnight, Stockholm time.
  function tick() {
    var now = S.puzzleNumber();
    if (now !== n) {
      n = now;
      if (mode === 'daily' || mode === 'friends') { lastShown.key = ''; render({ instant: true }); } else renderChrome();
      return;
    }
    var cd = $('countdown'); if (cd) cd.textContent = countdown();
    document.querySelectorAll('#statsBody .cd').forEach(function (el) { el.textContent = countdown(); });
  }
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

  // Friends (league + race) is optional: the tab only shows when the multiplayer relay is there and the device is online.
  var startMode = F ? F.init({ S: S, lang: function () { return lang; }, t: t, puzzle: function () { return n; }, today: function () { return store.days[n]; },
    dailyIso: function () { return S.countryForPuzzle(n).iso; }, esc: esc, toast: toast, refresh: function () { render({ instant: true }); } }) : null;
  if (startMode === 'friends' && friendsOn()) { mode = 'friends'; F.show(true); }
  render({ instant: true });
  if (!store.seenHelp) { store.seenHelp = true; save(); openHelp(); }
  else if (round().status === 'playing') focusInput();
})();
</script>
</body>
</html>
