function ellipse(c,x,y,rx,ry,fill,stroke=null,lw=1){c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,TAU);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke();}}
function roundRect(c,x,y,w,h,r,fill,stroke=null,lw=1){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke();}}
function line(c,pts,color,width=2){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.stroke();}
function polygon(c,pts,fill,stroke=null,width=1){c.beginPath();c.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)c.lineTo(...pts[i]);c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke();}}

function resize(){let r=canvas.getBoundingClientRect();view.w=r.width;view.h=r.height;view.dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(r.width*view.dpr);canvas.height=Math.round(r.height*view.dpr);applyCamera();}
function applyCamera(){view.scale=Math.min(view.w/W,view.h/H)*camera.zoom;camera.panX=clamp(camera.panX,-Math.max(0,(W*view.scale-view.w)/2),Math.max(0,(W*view.scale-view.w)/2));camera.panY=clamp(camera.panY,-Math.max(0,(H*view.scale-view.h)/2),Math.max(0,(H*view.scale-view.h)/2));view.x=(view.w-W*view.scale)/2+camera.panX;view.y=(view.h-H*view.scale)/2+camera.panY;}
function zoomBy(factor){camera.zoom=clamp(camera.zoom*factor,1,3);applyCamera();if(camera.zoom>1.01)canvas.style.cursor='grab';else canvas.style.cursor='default';}

function rangeCircle(x,y,r,valid=true,support=false){ctx.save();let col=valid?support?'#fff1ac':'#effbd0':'#ffb4a8';ctx.fillStyle=valid?'#e9ffc016':'#ed60521e';ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.stroke();ctx.restore();}
function drawProjectile(p){const c=ctx,s=p.stats;c.save();c.translate(p.x,p.y);c.rotate(p.kind==='boomer'?p.age*22:p.angle);if(p.kind==='bomb'){line(c,[[-8,0],[-17,0]],'#f8e6b171',3);ellipse(c,0,0,7,7,'#4f6164','#344a4f',1.5);ellipse(c,-2,-3,2.5,2,'#bec6b3');ellipse(c,-7,-4,2,2,'#ffc575');}else if(p.kind==='magic'||p.kind==='hero'){let col=p.kind==='hero'?'#ffe48c':'#ddb0f0';ellipse(c,0,0,10,10,p.kind==='hero'?'#ffda8326':'#c991e42c');line(c,[[-5,0],[-17,0]],p.kind==='hero'?'#ffde9766':'#ccabe766',4);ellipse(c,0,0,5,5,col);star(c,0,0,6,p.kind==='hero'?'#fff7cc':'#fcddff',4);}else if(p.kind==='glue'){line(c,[[-5,0],[-13,0]],'#becb6677',5);ellipse(c,0,0,6,5,'#d0df7c','#819c4c',1);ellipse(c,0,-2,3,1.4,'#edf7b8');}else if(p.kind==='boomer'){c.beginPath();c.moveTo(-8,-9);c.quadraticCurveTo(14,-6,8,13);c.lineTo(4,9);c.quadraticCurveTo(7,-2,-10,-4);c.closePath();c.fillStyle=s.pierce>14?'#e1e6d2':'#f6d07a';c.fill();c.strokeStyle='#b68b42';c.lineWidth=1.5;c.stroke();}else if(p.kind==='shard'){polygon(c,[[10,0],[-6,-4],[-2,0],[-6,4]],'#e1fffd','#8ac8cb',1);}else if(p.kind==='tack'){line(c,[[-9,0],[6,0]],s.lead?'#f6c47d':'#d5ddce',2.5);line(c,[[-7,-3],[-7,3]],'#798e83',2);}else{const sz=s.size||0;line(c,[[-11-sz,0],[6+sz,0]],'#755d45',2+sz*.3);polygon(c,[[10+sz*2,0],[3,-3.5-sz],[3,3.5+sz]],'#e4e9d3','#8b9c8a',.6);if(p.kind!=='fragment')polygon(c,[[-7,0],[-12,-4],[-15,-4],[-12,0],[-15,4],[-12,4]],s.size?'#b4c894':'#d78163');}c.restore();}
function drawEffect(e){let p=1-e.life/e.max,opacity=1-p,c=ctx;c.save();c.globalAlpha=opacity;if(e.type==='tracer'||e.type==='lightning'){if(e.type==='lightning'){const n=7,pts=[];for(let i=0;i<=n;i++){let a=i/n,off=i===0||i===n?0:Math.sin(i*9+p*8)*7;pts.push([lerp(e.x,e.x2,a)+off,lerp(e.y,e.y2,a)+off*.7]);}line(c,pts,'#b17eca',6);line(c,pts,e.color,2);}else{line(c,[[e.x,e.y],[e.x2,e.y2]],e.color,e.width||2);ellipse(c,e.x2,e.y2,5,5,'#fff5c666');}}else if(e.type==='explosion'){let r=e.r*(.2+Math.sqrt(p)*.85);ellipse(c,e.x,e.y,r,r,'#efb1782b');ellipse(c,e.x,e.y,r*.73,r*.73,null,'#f1a05f',5*(1-p)+1);ellipse(c,e.x,e.y,r*.47,r*.47,'#ffe2a3');if(p<.4)star(c,e.x,e.y,r*.85,'#fff0bd',9);}else if(e.type==='frost'){let r=e.r*Math.min(1,p*1.5);ellipse(c,e.x,e.y,r,r,'#cdeef01b','#d9ffffaa',3);for(let i=0;i<9;i++){let a=i*TAU/9;star(c,e.x+Math.cos(a)*r*.8,e.y+Math.sin(a)*r*.8,4,e.color,6);}}else if(e.type==='sun'){let r=e.r*Math.pow(p,.7);ellipse(c,e.x,e.y,r,r,'#ffe6a520','#fff0bf',6);ellipse(c,e.x,e.y,r*.8,r*.8,null,'#ffe399a0',3);}else{let r=e.r*(.15+Math.sqrt(p)*.85);ellipse(c,e.x,e.y,r,r,null,e.color,3*(1-p)+1);}c.restore();}
function updateVisuals(dt){time+=dt;shake=Math.max(0,shake-dt*15);flash=Math.max(0,flash-dt);for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.confetti){p.vx+=Math.sin(time*3+p.x)*dt*30;}else{p.vx*=Math.exp(-dt*3);p.vy*=Math.exp(-dt*3);p.vy+=30*dt;}}particles=particles.filter(p=>p.life>0);for(let e of effects)e.life-=dt;effects=effects.filter(e=>e.life>0);if(effects.length>160)effects=effects.slice(-160);for(let t of texts){t.life-=dt;t.y-=21*dt;}texts=texts.filter(t=>t.life>0);if(S)for(let t of S.towers){t.spawn=Math.max(0,t.spawn-dt);t.recoil=Math.max(0,t.recoil-dt*7);}}
function render(){ctx.setTransform(view.dpr,0,0,view.dpr,0,0);ctx.fillStyle=map.theme==='night'?'#345f65':'#6bac97';ctx.fillRect(0,0,view.w,view.h);ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.scale,view.scale);if(shake>0)ctx.translate(Math.sin(time*83)*shake*.45,Math.cos(time*71)*shake*.4);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();if(bg)ctx.drawImage(bg,0,0,W,H);
// Quiet water movement, soft enough not to compete with the balloons.
const pd=map.pond;ctx.save();ctx.beginPath();ctx.ellipse(pd.x,pd.y,pd.rx-3,pd.ry-3,0,0,TAU);ctx.clip();for(let i=0;i<7;i++){const y=pd.y-pd.ry+(i*37+time*5)%(pd.ry*2);let x=pd.x+Math.sin(i*1.7+time*.3)*pd.rx*.38;ctx.globalAlpha=.2;line(ctx,[[x-16,y],[x-2,y+1.5],[x+14,y]],'#e2f3d8',1.5);}ctx.restore();
if(S){for(let i=0;i<map.obstacles.length;i++)if(!S.removed.includes(i)){let o=map.obstacles[i];drawRock(ctx,o.x,o.y,o.r,selected==='rock:'+i);}const st=S.towers.find(t=>t.id===selected);if(st)rangeCircle(st.x,st.y,st.stats.range,true,st.type==='village');if(placement&&pointer.inside){const v=buildValid(pointer.x,pointer.y,placement),c=price(BASE[placement].cost,pointer.x,pointer.y);rangeCircle(pointer.x,pointer.y,BASE[placement].range,v.ok&&(S.sandbox||S.cash>=c),placement==='village');}
// Upright characters and floating balloons retain readable silhouettes.
const towers=[...S.towers].sort((a,b)=>a.y-b.y);for(let t of towers){let s=t.stats;if(t.id===selected){ellipse(ctx,t.x,t.y+4,31,28,'#fbffce23','#ffffd5',2.5);}if(t.buffed){ellipse(ctx,t.x,t.y+16,23,7,null,'#e5dfa477',1.8);}if(t.buff>0||S.rally>0){ellipse(ctx,t.x,t.y,31+Math.sin(time*6)*2,31+Math.sin(time*6)*2,'#ffe4a015','#fff0a085',1.5);}if(s.orbit){for(let i=0;i<s.orbit;i++){let a=S.tick*3+i*TAU/s.orbit,x=t.x+Math.cos(a)*65,y=t.y+Math.sin(a)*65;ctx.save();ctx.translate(x,y);ctx.rotate(a*3);star(ctx,0,0,12,'#ebecd2',4);ellipse(ctx,0,0,3,3,'#a88651');ctx.restore();}}let spawnScale=t.spawn>0?1-Math.pow(t.spawn/.4,2)*.8:1;drawTowerCached(ctx,t,spawnScale);if(t.type==='hero'){roundRect(ctx,t.x-10,t.y+24,20,14,5,'#a67a39','#e7c46e',1);ctx.fillStyle='#fff4c3';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(t.level,t.x,t.y+34);}else if(t.up.some(Boolean)){let w=5*t.up.filter(Boolean).length;let i=0;for(let j=0;j<3;j++)if(t.up[j]>0){roundRect(ctx,t.x-w+10*i,t.y+26,8,5,2,t.up[j]>=3?'#fff1a4':'#e4edc0');i++;}}}
let arr=[...S.enemies].sort((a,b)=>a.y-b.y);for(let e of arr)if(!e.dead&&e.x>-65&&e.x<W+65)drawEnemy(ctx,e);for(let p of S.projectiles)drawProjectile(p);for(let e of effects)drawEffect(e);
if(placement&&pointer.inside){const v=buildValid(pointer.x,pointer.y,placement),c=price(BASE[placement].cost,pointer.x,pointer.y),ok=v.ok&&(S.sandbox||S.cash>=c);ctx.save();ctx.globalAlpha=ok?.85:.45;drawMonkey(ctx,placement,pointer.x,pointer.y,1,-.6);ctx.restore();roundRect(ctx,pointer.x-35,pointer.y+34,70,24,8,ok?'#234b3be8':'#a45948e8');ctx.fillStyle='#fff9d3';ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.fillText(money(c),pointer.x,pointer.y+50);}
}
for(let p of particles){ctx.save();ctx.globalAlpha=Math.min(1,p.life/p.max*2);if(p.confetti){ctx.translate(p.x,p.y);ctx.rotate(time*2+p.x);ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);}else{ctx.fillStyle=p.color;ctx.fillRect(p.x-p.r*.65,p.y-p.r*.65,p.r*1.3,p.r*1.3);}ctx.restore();}for(let t of texts){ctx.save();ctx.globalAlpha=Math.min(1,t.life/.25);ctx.font='850 13px system-ui';ctx.textAlign='center';ctx.strokeStyle='#3253358f';ctx.lineWidth=3;ctx.lineJoin='round';ctx.strokeText(t.text,t.x,t.y);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y);ctx.restore();}
if(map.theme==='night')for(let j=0;j<20;j++){let x=(j*179+85)%W+Math.sin(time*.6+j)*13,y=(j*137+42)%H+Math.cos(time*.8+j*2)*12;ctx.globalAlpha=.3+Math.sin(time*1.4+j)*.2;ellipse(ctx,x,y,2,2,'#f2e39e');}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle=`rgba(211,65,55,${flash*.55})`;ctx.fillRect(0,0,W,H);}ctx.restore();ctx.restore();}
function frame(ts){if(!last)last=ts;const dt=Math.min(.06,(ts-last)/1000);last=ts;updateVisuals(dt);if(S&&!S.paused&&!S.ended){acc+=dt*S.speed;let steps=0;while(acc>=1/60&&steps++<14){updateGame(1/60);acc-=1/60;}if(steps>=14)acc=0;}else acc=0;uiTimer+=dt;if(uiTimer>.16){uiTimer=0;updateHUD();}render();rafCount++;requestAnimationFrame(frame);}
function pointerWorld(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.scale,y:(e.clientY-r.top-view.y)/view.scale};}
canvas.addEventListener('pointermove',e=>{if(panStart){let dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;if(Math.hypot(dx,dy)>5)panStart.moved=true;if(panStart.moved){camera.panX=panStart.panX+dx;camera.panY=panStart.panY+dy;applyCamera();canvas.style.cursor='grabbing';return;}}const p=pointerWorld(e);pointer={...p,inside:p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H};if(!S)return;if(placement)canvas.style.cursor='crosshair';else{let target=S.towers.some(t=>(t.x-p.x)**2+(t.y-p.y)**2<33**2)||map.obstacles.some((o,i)=>!S.removed.includes(i)&&(o.x-p.x)**2+(o.y-p.y)**2<(o.r+9)**2);canvas.style.cursor=target?'pointer':camera.zoom>1?'grab':'default';}});
canvas.addEventListener('pointerleave',()=>{pointer.inside=false;});
function mapPress(e){if(e.button===2){placement=null;showShop();$('fieldHelp').classList.add('hidden');return;}if(e.button!==0||!S||S.ended||S.paused)return;e.preventDefault();Audio.init();const p=pointerWorld(e);pointer={...p,inside:true};if(placement){place(placement,p.x,p.y,e.shiftKey);return;}let t=[...S.towers].sort((a,b)=>dist2(p,a)-dist2(p,b))[0];if(t&&dist2(p,t)<35**2){selectTower(t.id);return;}for(let i=0;i<map.obstacles.length;i++){let o=map.obstacles[i];if(!S.removed.includes(i)&&(o.x-p.x)**2+(o.y-p.y)**2<(o.r+10)**2){selected='rock:'+i;renderDetail();return;}}selected=null;showShop();$('fieldHelp').classList.add('hidden');}
canvas.addEventListener('pointerdown',e=>{if(camera.zoom>1.01&&!placement&&e.button===0&&S&&!S.paused&&!S.ended){panStart={x:e.clientX,y:e.clientY,panX:camera.panX,panY:camera.panY,moved:false};canvas.setPointerCapture(e.pointerId);e.preventDefault();}else mapPress(e);});
canvas.addEventListener('pointerup',e=>{if(!panStart)return;const moved=panStart.moved;panStart=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(!moved)mapPress(e);});canvas.addEventListener('pointercancel',()=>{panStart=null;});
canvas.addEventListener('wheel',e=>{if(!S)return;e.preventDefault();zoomBy(Math.exp(-e.deltaY*.0015));},{passive:false});
$('zoomIn').onclick=()=>zoomBy(1.35);$('zoomOut').onclick=()=>zoomBy(1/1.35);$('zoomFit').onclick=()=>{camera.zoom=1;camera.panX=0;camera.panY=0;applyCamera();};
canvas.addEventListener('contextmenu',e=>e.preventDefault());
$('towerGrid').addEventListener('click',e=>{let b=e.target.closest('[data-tower]');if(b)selectBuild(b.dataset.tower);});
$('heroCard').onclick=()=>selectBuild('hero');
$('detailPanel').addEventListener('click',e=>{let b=e.target.closest('button');if(!b||!S)return;if(b.dataset.action==='back'){placement=null;showShop();}if(b.dataset.action==='target'){let t=S.towers.find(t=>t.id===selected);if(t){t.target=targets[(targets.indexOf(t.target)+1)%targets.length];renderDetail();saveCheckpoint();}}if(b.dataset.action==='sell')sellTower(selected);if(b.dataset.upgrade!==undefined)buyUpgrade(selected,+b.dataset.upgrade);if(b.dataset.clearRock!==undefined){let idx=+b.dataset.clearRock,cost=price(150);if(S.sandbox||S.cash>=cost){if(!S.sandbox)S.cash-=cost;S.removed.push(idx);let o=map.obstacles[idx];burst(o.x,o.y,'#d5d6b8',25,100);Audio.fx('bomb',o.x);showShop();saveCheckpoint();updateHUD(true);}}});
$('startWave').onclick=()=>{Audio.init();startRound();};$('speedBtn').onclick=()=>{if(!S)return;S.speed=S.speed%3+1;updateHUD(true);saveCheckpoint();};$('autoBtn').onclick=()=>{if(!S)return;S.auto=!S.auto;autoTimer=1.7;updateHUD(true);saveCheckpoint();};$('audioBtn').onclick=audioDialog;$('musicChip').onclick=audioDialog;$('helpBtn').onclick=guideDialog;document.querySelector('header .brand').style.cursor='pointer';document.querySelector('header .brand').onclick=()=>{if($('menuOverlay').classList.contains('hidden'))returnMenu();};$('lgTrophy').hidden=!(window.Ludvig&&window.Ludvig.ui);$('lgTrophy').onclick=e=>{e.currentTarget.blur();ludvigOpen('pop-island');};$('pauseBtn').onclick=pauseDialog;
$('abilities').onclick=e=>{let b=e.target.closest('[data-ability]');if(b)useAbility(b.dataset.ability);};
$('playBtn').onclick=()=>startGame();$('continueBtn').onclick=()=>{const saved=store.get('popisland-save-v1');if(saved&&saved.version===1&&MAPS[saved.map]&&DIFF[saved.diff]&&Array.isArray(saved.towers)&&saved.towers.every(t=>BASE[t.type]))startGame(saved);else{toast('That checkpoint could not be read. Start a new island.');store.remove('popisland-save-v1');$('continueBtn').classList.add('hidden');}};
$('mapOptions').onclick=e=>{let b=e.target.closest('[data-map]');if(b){selectedMap=+b.dataset.map;setupMap(selectedMap);drawCover();updateSetup();}};$('difficultyOptions').onclick=e=>{let b=e.target.closest('[data-diff]');if(b){selectedDiff=b.dataset.diff;updateSetup();}};
$('dialog').onclick=e=>{let b=e.target.closest('[data-dialog]');if(!b)return;let a=b.dataset.dialog;if(a==='close'){Audio.init();closeDialog();}if(a==='audio')audioDialog();if(a==='restart')restart();if(a==='menu')returnMenu();if(a==='endless'){S.ended=false;S.paused=false;S.endless=true;S.active=false;pauseBeforeDialog=false;closeDialog();autoTimer=2;saveCheckpoint();banner('FREEPLAY');}};
$('sandboxJump').onclick=()=>{if(!S?.sandbox)return;const r=clamp(Math.floor(+$('sandboxRound').value||1),1,200);S.round=r-1;S.active=false;S.enemies=[];S.pending=[];S.projectiles=[];updateHUD(true);toast('Round '+r+' is ready.');};$('sandboxClear').onclick=()=>{if(!S?.sandbox)return;S.enemies=[];S.pending=[];S.spawnIndex=S.spawn.length;S.projectiles=[];if(S.active)completeRound();updateHUD(true);};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;let key=e.key.toLowerCase();if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)&&key!=='escape')return;if(!e.repeat&&key==='m'){Audio.settings.muted=!Audio.settings.muted;Audio.apply();return;}if(!$('menuOverlay').classList.contains('hidden')){if(key==='enter'||key===' '){e.preventDefault();startGame();}return;}if(dialogKind){if((key==='r'||key==='enter')&&dialogKind==='result'){e.preventDefault();restart();}else if((key==='escape'||key==='p')&&dialogKind!=='result'){e.preventDefault();closeDialog();}return;}if(e.repeat)return;if(key===' '){e.preventDefault();startRound();}else if(key==='f')$('speedBtn').click();else if(key==='a')$('autoBtn').click();else if(key==='p')pauseDialog();else if(key==='escape'){e.preventDefault();if(placement||selected!==null){placement=null;showShop();$('fieldHelp').classList.add('hidden');}else pauseDialog();}else if(/^[0-9]$/.test(key)){selectBuild(hotkeys[key==='0'?9:+key-1]);}else if(key==='h')selectBuild('hero');else if(key==='backspace'||key==='delete'){if(typeof selected==='number'){e.preventDefault();sellTower(selected);}}else{let a=allAbilities().find(a=>a.key.toLowerCase()===key);if(a)useAbility(a.id);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S?.active&&!S.paused&&!S.ended&&!dialogKind)pauseDialog();if(Audio.ctx?.state==='running')Audio.ctx.suspend().catch(()=>{});}else{last=performance.now();acc=0;if(Audio.ctx)Audio.ctx.resume().catch(()=>{});}});
window.addEventListener('beforeunload',()=>saveCheckpoint());window.addEventListener('resize',resize);
// Boot once. All assets are made locally and then reused.
setupMap(0);createIcons();populateShop();$('mapOptions').innerHTML=MAPS.map((m,i)=>{let route=buildPath(m),image=drawMap(m,route,.24);return`<button class="map-option ${i===0?'selected':''}" data-map="${i}"><img src="${image.toDataURL('image/png')}" alt="${m.name} map"><strong>${m.name}</strong><small>${m.tag}</small></button>`;}).join('');drawCover();Audio.apply();updateSetup();const saved=store.get('popisland-save-v1');if(saved&&MAPS[saved.map]){$('continueBtn').classList.remove('hidden');$('continueBtn').textContent=`Continue ${MAPS[saved.map].name} · Round ${saved.round+1}`;}resize();requestAnimationFrame(frame);
// Test hooks are opt-in, only when the file is opened with #test.
if(location.hash==='#test')window.__POP={get state(){return S;},get map(){return map;},get path(){return path;},get audio(){return Audio;},get frames(){return rafCount;},start:startGame,step:updateGame,recalc,place,upgrade:buyUpgrade,sell:sellTower,spawn:spawnEnemy,wave:startRound,makeWave,hit:damageEnemy,ability:useAbility,abilities:allAbilities,valid:buildValid,save:saveCheckpoint,serialize,stats:rawStats,upgradeState,finish,render,updateHUD,select:selectTower,enemyDefs:ENEMY,base:BASE,upgrades:UP,position:pathPos,price,completeRound,returnMenu};
})();
