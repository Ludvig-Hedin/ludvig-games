<title>Origin — Guess the city</title>

<style>/* Explicit surfaces prevent dark parent pages from leaking into the light game. */
:root,.origin-app {
  --paper:#f7f7f3; --white:#ffffff; --ink:#202922; --muted:#526057;
  --line:#d7ded7; --accent:#b74424; --accent-hover:#98361c;
  --green:#286043; --sea:#eaf0ee; --land:#becdbf;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  color-scheme:only light;
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  font-size:15px; font-synthesis:none;
}
html,body{margin:0;min-height:100%;background:#f7f7f3;color:#202922;overflow-x:hidden}
.origin-app{min-height:100vh;min-height:100dvh;isolation:isolate;-webkit-font-smoothing:antialiased}
.origin-app *,.origin-app *::before,.origin-app *::after{box-sizing:border-box}
.origin-app [hidden]{display:none!important}
.origin-app button,.origin-app input,.origin-app textarea{font:inherit;color:var(--ink)}
.origin-app button,.origin-app a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.origin-app button{border:0;background:none;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;line-height:1.2}
.origin-app button:disabled{cursor:not-allowed}
.origin-app a{color:inherit}
.origin-app button:focus-visible,.origin-app a:focus-visible,.origin-app input:focus-visible,.origin-app summary:focus-visible,.origin-app svg:focus-visible,.origin-app textarea:focus-visible{outline:3px solid #2867a0;outline-offset:3px}
#question:focus,#main:focus{outline:none}
.origin-app p{line-height:1.6}
.origin-app svg.icon{height:18px;width:18px;flex-shrink:0;stroke-width:1.8;vertical-align:middle}
.origin-app span[data-icon]{display:inline-flex;align-items:center;justify-content:center}
.page{max-width:1280px;padding:env(safe-area-inset-top,0px) max(32px,env(safe-area-inset-right,0px)) max(36px,env(safe-area-inset-bottom,0px)) max(32px,env(safe-area-inset-left,0px));margin:0 auto;background:var(--paper)}
.header{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:-1.6px;line-height:1;color:var(--ink)}
.brand-period{color:var(--accent)}
.brandmark{border:1.8px solid var(--accent);border-radius:50%;width:23px;height:23px;display:grid;place-items:center}
.brandmark>span{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.header-actions{display:flex;align-items:center;gap:12px}
.nav{display:flex;gap:3px;padding:4px;background:#e8ece6;border-radius:11px}
.nav-item{font-size:13px!important;padding:10px 19px;min-height:36px;border-radius:8px;font-weight:550}
.nav-item:not(.active):hover{background:#dae1d8}
.nav-item.active{background:#ffffff;color:#202922;box-shadow:0 1px 3px #20292215}
.icon-button{height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px}
.icon-button:hover{background:#e6ebe3}
.menu-wrap{position:relative}
.options-menu{position:absolute;top:calc(100% + 8px);right:0;width:210px;padding:6px;background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #17271c18;z-index:20}
.options-menu>button{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:11px 12px;border-radius:7px;text-align:left;font-size:14px}
.options-menu>button:hover{background:#f0f3ee}
.options-menu>button:last-child{border-top:1px solid var(--line);border-radius:0 0 7px 7px;margin-top:4px;padding-top:14px}
.game-status{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:34px 0 24px}
.round-heading{min-width:0}
h1{font-family:var(--serif);font-size:37px;font-weight:400;line-height:1.15;letter-spacing:-1px;margin:0 0 13px;color:var(--ink)}
.round-meta{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted);min-height:16px}
.journey{display:flex;gap:5px}
.journey-step{height:5px;width:22px;background:#d8dfd7;border-radius:3px}
.journey-step.current{background:var(--accent)}
.journey-step.complete{background:var(--green)}
.points{display:flex;align-items:baseline;gap:5px;white-space:nowrap;align-self:flex-end;padding-bottom:2px}
.points strong{font-size:23px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.points>span{font-size:13px;color:var(--muted)}
.game-grid{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:22px;align-items:stretch}
.clue-card,.map-card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.clue-card{display:flex;flex-direction:column}
.art-wrap{position:relative;aspect-ratio:1.2;background:#eddfc6;overflow:hidden;flex:1;min-height:280px}
.art{position:absolute;inset:0;display:grid;place-items:center}
.art>svg{width:100%;height:100%;display:block}
.category-pill{position:absolute;top:17px;left:17px;display:inline-flex;align-items:center;gap:6px;background:#fffdf8;color:#354032;padding:8px 12px;min-height:33px;border-radius:7px;font-size:12px;font-weight:550;box-shadow:0 1px 2px #20292207}
.category-pill .icon{width:14px!important;height:14px!important}
.expand-btn{position:absolute;top:12px;right:12px;background:#fffdf8!important;border:1px solid #20292212!important}
.expand-btn:hover{background:#f3f3e9!important}
.clue-copy{padding:19px 20px;min-height:106px;background:var(--white)}
.clue-caption{display:flex;align-items:center;gap:16px;min-height:64px}
.clue-caption p{margin:0;flex:1;color:#39463c;font-size:14px;line-height:1.55}
.hint-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;flex-shrink:0;max-width:96px;min-height:44px;padding:9px 10px;border:1px solid var(--line)!important;border-radius:8px;background:#f7f8f4!important;font-size:12px!important;color:#334236!important}
.hint-btn:hover:not(:disabled){background:#e9eee5!important;border-color:#899c8a!important}
.hint-btn .icon{height:14px!important;width:14px!important}
.hint-cost{font-size:11px;color:#526057}
.hint-btn:disabled{background:#f3f5ef!important;border-color:#e0e4dc!important}
.hint-text{padding:12px 14px;border-left:3px solid var(--green);background:#eef3e9;font-size:13px;line-height:1.6;margin-top:14px;color:#334537;border-radius:0 6px 6px 0}
.answer-details{margin-top:2px;color:#39463c}
.answer-details summary,.save-details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:8px 0;line-height:1.5;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.answer-details p{font-size:14px;margin:8px 0}
.source-link{color:var(--green)!important;font-size:13px;display:inline-flex;gap:5px;align-items:center;text-underline-offset:3px;padding:7px 0}
.source-link .icon{height:13px!important;width:13px!important}
.clue-card.revealed .clue-caption{min-height:30px}
.clue-card.revealed .clue-caption p{font-weight:600;font-size:16px;color:var(--ink)}
.map-card{display:flex;flex-direction:column}
.map-stage{position:relative;flex:1;min-height:360px;background:var(--sea);overflow:hidden}
#world-map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;outline-offset:-5px!important}
.map-stage.locked #world-map{cursor:grab}
#world-map:active{cursor:grabbing}
#map-countries path{fill:var(--land);stroke:#f8fbf6;stroke-width:1;vector-effect:non-scaling-stroke;transition:fill .15s}
#map-countries path:hover{fill:#a5b9a9}
.map-stage.locked #map-countries path:hover{fill:var(--land)}
#map-grid{display:none}
#map-labels{pointer-events:none}
#map-labels text{font-family:var(--sans);fill:#344b3c;font-weight:500;text-anchor:middle;user-select:none}
#map-pins,#map-lines{pointer-events:none}
.map-search{position:absolute;z-index:3;top:17px;left:17px;width:min(286px,calc(100% - 34px));height:44px;border:1px solid #b8c7ba;background:#ffffff;border-radius:9px;display:flex;align-items:center;padding:0 12px;gap:9px;box-shadow:0 2px 7px #20292206}
.map-search:focus-within{outline:2px solid #2867a0;outline-offset:2px}
.map-search>.icon,.map-search>span .icon{width:17px;height:17px;color:#526057}
.map-search input{border:0;background:#ffffff;min-width:0;width:100%;height:100%;outline:none!important;font-size:13px;color:#202922;box-shadow:none!important}
.map-search input::placeholder{color:#526057;opacity:1}
.search-results{position:absolute;top:49px;left:-1px;right:-1px;background:#ffffff;border:1px solid #b8c7ba;border-radius:9px;overflow:auto;max-height:260px;box-shadow:0 8px 18px #20292212}
.search-result{display:flex;width:100%;justify-content:space-between;gap:12px;align-items:center;padding:12px;text-align:left;min-height:44px;font-size:13px!important}
.search-result span{font-size:12px;color:#526057}
.search-result:hover,.search-result.selected{background:#eaf0e5}
.search-empty{padding:14px;font-size:13px;line-height:1.5;color:#526057}
.map-tools{position:absolute;right:16px;bottom:17px;display:flex;flex-direction:column;background:#ffffff;border:1px solid #b8c7ba;border-radius:9px;overflow:hidden}
.map-tools button{height:44px;width:44px;display:grid;place-items:center;color:#283d2e}
.map-tools button+button{border-top:1px solid var(--line)}
.map-tools button:hover{background:#e9efe5}
.map-tools .icon{height:17px!important;width:17px!important}
.map-attribution{position:absolute;bottom:11px;left:14px;font-size:10px;color:#526057;pointer-events:none}
.guess-area{padding:20px;min-height:91px;display:flex;justify-content:space-between;align-items:center;gap:18px;border-top:1px solid var(--line);background:#ffffff}
.guess-detail{display:flex;align-items:center;gap:10px;min-width:0}
.guess-detail>span{color:var(--muted)}
.guess-detail>span .icon{height:21px;width:21px}
.guess-detail>div{min-width:0}
.guess-detail strong{display:block;font-size:13px;font-weight:500;line-height:1.45;color:#455248}
.guess-detail div>span{display:block;font-size:12px;line-height:1.45;color:var(--muted);margin-top:3px}
.guess-area.has-pin .guess-detail strong{font-size:14px;font-weight:600;color:var(--ink)}
.guess-area.has-pin .guess-detail>span{color:var(--accent)}
.primary-btn{display:inline-flex;align-items:center;justify-content:center;gap:13px;min-height:49px;flex-shrink:0;padding:14px 19px;border-radius:9px;background:var(--accent)!important;color:#ffffff!important;font-size:14px!important;font-weight:600;white-space:nowrap}
.primary-btn:hover:not(:disabled){background:var(--accent-hover)!important}
.primary-btn:disabled{background:#e0e5dd!important;color:#576250!important}
.primary-btn .icon{height:17px!important;width:17px!important}
.guess-area.result .guess-detail>span{display:none}
.guess-area.result .guess-detail strong{font-size:25px;font-weight:650;letter-spacing:-.6px;color:var(--green)}
.guess-area.result .guess-detail div>span{font-size:13px}
.secondary-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;min-height:45px;border:1px solid #bcc9bd!important;background:#ffffff!important;border-radius:9px;font-size:14px!important;white-space:nowrap}
.secondary-btn:hover{background:#edf2e9!important}
.text-btn{font-size:13px!important;text-decoration:underline;text-underline-offset:3px;padding:12px 3px;min-height:44px;display:inline-flex;gap:6px;align-items:center}
.banner{padding:14px 17px;border-radius:10px;background:#f6ead9;color:#54401b;border:1px solid #dfc69e;font-size:14px;margin-top:18px;line-height:1.6}
.banner button{text-decoration:underline;font-weight:600;padding:5px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,10px);background:#202922;color:#ffffff;padding:13px 19px;max-width:calc(100vw - 32px);width:max-content;border-radius:10px;font-size:14px;line-height:1.5;z-index:50;box-shadow:0 4px 22px #17271c22;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dialog{border:1px solid var(--line);border-radius:16px;background:#ffffff;color:var(--ink);padding:32px;max-width:490px;width:calc(100vw - 32px);max-height:88svh;box-shadow:0 20px 100px #14211830;overflow:auto}
.dialog::backdrop{background:#18251e66;backdrop-filter:blur(3px)}
.dialog-close{position:absolute;top:9px;right:9px}

.dialog .primary-btn{margin-top:15px;width:100%}
.dialog.image-dialog{max-width:820px;padding:54px 16px 16px}
.dialog-art{overflow:hidden;border-radius:9px}
.dialog-art svg{width:100%;display:block;max-height:70svh}
.how-step{display:flex;align-items:flex-start;gap:14px;margin:20px 0}
.how-step>span{height:27px;width:27px;flex-shrink:0;border-radius:50%;background:#edf2e9;color:var(--green);font-size:13px;font-weight:600;display:grid;place-items:center}
.how-step p{margin:0;font-size:13px}
.help-details{margin:20px 0 8px;border-top:1px solid var(--line);padding-top:8px}
.help-details summary{cursor:pointer;min-height:44px;padding:10px 0;font-size:13px}

.keyboard-guide{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:14px 0;font-size:12px;align-items:center}

.board-empty{padding:26px 0;text-align:center}
.board-empty>.icon{height:32px!important;width:32px!important;color:var(--green);margin-bottom:15px}
.board-empty h3{font-weight:600;font-size:18px}
.board-empty p{max-width:300px;margin:8px auto 0}
.board-row{display:flex;align-items:center;gap:12px;padding:16px 10px;border-bottom:1px solid var(--line)}
.board-row.me{background:#edf3e8;border-radius:8px}
.board-rank{font-size:14px;color:var(--muted);min-width:22px}
.board-name{flex:1;font-size:14px;overflow-wrap:anywhere}

.board-score{font-size:15px;font-variant-numeric:tabular-nums}
.board-header{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 10px 10px;border-bottom:1px solid var(--line)}
.summary{max-width:730px;margin:0 auto}
.summary-panel{background:#ffffff;border:1px solid var(--line);border-radius:16px;padding:30px}
.summary-score{font-size:64px;line-height:1.1;font-weight:550;letter-spacing:-3px;font-variant-numeric:tabular-nums;color:var(--green)}
.summary-score small{font-size:17px;font-weight:400;letter-spacing:0;color:var(--muted);margin-left:10px;white-space:nowrap}
.summary-caption{font-size:13px;color:var(--muted);margin:9px 0 25px}
.summary-row{display:flex;align-items:center;gap:13px;border-top:1px solid var(--line);padding:16px 0}
.summary-number{width:25px;height:25px;background:#edf2e8;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--green)}
.summary-row>div{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.summary-row strong{font-weight:550;font-size:14px;line-height:1.4}
.summary-row small{font-size:12px;color:var(--muted);line-height:1.4}
.summary-row>span:last-child{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.summary-actions{display:flex;gap:8px;margin:22px 0 17px;align-items:center;flex-wrap:wrap}
.summary-actions>.primary-btn{flex:1}
.summary-actions>.secondary-btn{height:49px;min-width:45px;padding:12px}
.summary-actions>.text-btn{margin-left:12px}
.save-details{border-top:1px solid var(--line);padding-top:12px}
.save-details>summary{font-size:14px;text-decoration:none}
.score-form{display:flex;gap:8px;margin:15px 0 10px}
.score-form label{flex:1;min-width:0}
.score-form input{height:46px;width:100%;border:1px solid #b6c5b7;border-radius:8px;padding:11px 13px;background:#ffffff;font-size:14px}

.form-note{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0}
.countdown-note{color:var(--muted);font-size:12px;text-align:center;margin:18px 0 0}
.countdown{font-variant-numeric:tabular-nums}
.copy-box{width:100%;height:160px;border:1px solid #b6c5b7;border-radius:8px;padding:12px;font:14px/1.6 var(--sans);background:#f7f8f4;resize:vertical}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-200px;left:16px;background:#202922;color:#ffffff!important;padding:12px 16px;border-radius:8px;z-index:100}
.skip-link:focus{top:12px}

<div class="page">

        <div class="round-meta"><span id="round-label">Round 1 of 5</span><div id="journey" class="journey" aria-label="Round progress"></div><span id="summary-date" hidden></span></div>

          <span class="category-pill" id="category-pill">Food</span>
          <button id="expand-btn" class="expand-btn icon-button" aria-label="Enlarge clue" title="Enlarge clue"><span data-icon="expand"></span></button>

        <div class="clue-copy">
          <div class="clue-caption">
            <p id="clue-description">Loading clue…</p>
            <button id="hint-btn" class="hint-btn" aria-expanded="false" aria-controls="hint-text"><span data-icon="bulb"></span><span>Hint</span><span class="hint-cost">−500<span class="visually-hidden"> points</span></span></button>
          </div>
          <div id="hint-text" class="hint-text" hidden></div>
          <details id="answer-details" class="answer-details" hidden>
            <summary>Why here?</summary>
            <p id="clue-story"></p>
            <a id="source-link" class="source-link" href="#" target="_blank" rel="noopener noreferrer">Source <span data-icon="external"></span></a>
          </details>
        </div>
      </section>
      <section class="map-card" aria-label="Choose a location">
        <div class="map-stage" id="map-stage">
          <div class="map-search" id="map-search">
            <span data-icon="search"></span>
            <input id="city-search" type="search" placeholder="Search city or country" aria-label="Search city or country" autocomplete="off" role="combobox" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list" spellcheck="false">
            <div id="search-results" class="search-results" role="listbox" hidden></div>
          </div>

            <rect x="-5000" y="-5000" width="10000" height="10000" fill="#eaf0ee"/>

          </svg>
          <div class="map-tools" aria-label="Map controls">
            <button id="zoom-in" aria-label="Zoom in" title="Zoom in"><span data-icon="plus"></span></button>
            <button id="zoom-out" aria-label="Zoom out" title="Zoom out"><span data-icon="minus"></span></button>
            <button id="zoom-reset" aria-label="Reset map" title="Reset map"><span data-icon="globe"></span></button>
          </div>
        </div>

          <div class="guess-detail"><span id="guess-icon" data-icon="pin"></span><div><strong id="guess-place">Place a pin on the map</strong><span id="guess-coords" hidden></span></div></div>
          <button id="guess-btn" class="primary-btn" disabled aria-describedby="guess-place"><span id="guess-btn-text">Submit guess</span><span data-icon="arrow"></span></button>
        </div>
      </section>
    </div>
    <section id="summary" class="summary" aria-label="Your results" hidden></section>
  </main>
</div>
<dialog id="dialog" class="dialog" aria-label="Origin information"><button id="dialog-close" class="dialog-close icon-button" aria-label="Close dialog"><span data-icon="close"></span></button><div id="dialog-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div><div id="live-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</div>

  $(id).classList.toggle('active',active);
  if(active)$(id).setAttribute('aria-current','page');else $(id).removeAttribute('aria-current');
 }
 $('total-points').textContent=fmt(total());
 document.querySelector('.points').hidden=isSummary;
 $('round-label').textContent=isSummary?dateLabel(run.date,true):`Round ${index+1} of 5`;
 $('game').hidden=isSummary;
 $('summary').hidden=!isSummary;
 $('journey').hidden=isSummary;
 if(isSummary){$('question').textContent=isDaily?'Daily complete.':'Practice complete.';renderSummary();return;}
 const clue=run.clues[index],cat=CAT[clue.category];
 $('art').innerHTML=clueArt(clue);
 $('art').setAttribute('role','img');$('art').setAttribute('aria-label',clue.description);
 // Preserve the whole illustration on small screens; match any letterboxing to its own paper.
 document.querySelector('.art-wrap').style.background=$('art').querySelector('svg>rect')?.getAttribute('fill')||'#eddfc6';
 $('category-pill').innerHTML=icon(cat.icon)+cat.label;
 $('expand-btn').disabled=false;
 hideSearch();$('city-search').value='';
 $('map-search').hidden=isResult;
 $('map-stage').classList.toggle('locked',isResult);
 $('hint-btn').hidden=isResult;
 $('answer-details').hidden=!isResult;
 $('answer-details').open=false;
 $('guess-icon').dataset.icon=isResult?'check':'pin';
 const area=document.querySelector('.guess-area');
 area.classList.toggle('result',isResult);area.classList.toggle('has-pin',!!pin&&!isResult);
 document.querySelector('.clue-card').classList.toggle('revealed',isResult);
 $('guess-place').removeAttribute('title');
 if(!isResult){
  $('question').textContent='Where is this from?';
  $('clue-description').textContent=SHORT_CLUES[clue.id]||clue.description;
  $('guess-place').textContent=matchMedia('(pointer:coarse)').matches?'Tap map to place a pin':'Click map to place a pin';
  $('guess-coords').textContent='';$('guess-coords').hidden=true;
  $('guess-btn-text').textContent='Submit guess';$('guess-btn').disabled=!pin;
  $('hint-btn').disabled=!!run.hints[index];
  $('hint-btn').setAttribute('aria-expanded',String(!!run.hints[index]));
  $('hint-btn').innerHTML=icon('bulb')+(run.hints[index]?'<span>Hint used</span>':'<span>Hint</span><span class="hint-cost">−500<span class="visually-hidden"> points</span></span>');
  $('hint-text').hidden=!run.hints[index];$('hint-text').textContent=run.hintTexts[index]||'';
  $('world-map').setAttribute('aria-label','World map. Click to place a pin, drag to pan, scroll to zoom. Arrow keys move your pin. Enter submits. City search is also available.');
  resetMap();if(pin)placePin(pin,null,true);
 }else{
  const r=run.results[index],a=r.answer;
  $('question').textContent=a.city+', '+a.country;
  $('clue-description').textContent=a.name;
  $('clue-story').textContent=a.story;
  $('source-link').href=a.source;
  $('source-link').innerHTML=esc(a.sourceLabel)+' '+icon('external');
  $('hint-text').hidden=true;
  $('guess-place').textContent='+'+fmt(r.points)+' pts';
  $('guess-coords').textContent=(r.distance<1?'Less than 1 km away':fmt(r.distance)+' km away')+(r.hinted?' · Hint used':'');
  $('guess-coords').hidden=false;
  $('guess-btn-text').textContent=index===4?'See results':'Next round';$('guess-btn').disabled=false;
  $('world-map').setAttribute('aria-label',`Result map. Your guess and ${a.city}, ${a.country}. ${fmt(r.distance)} kilometers away. Zoom or pan to inspect.`);
  fitResult(r);
 }
 renderJourney();icons();drawPins();
}
function renderJourney(){
 $('journey').innerHTML=run.clues.map((c,i)=>{
  const r=run.results[i],current=i===index;
  return`<span class="journey-step ${r?'complete':current?'current':''}" ${current?'aria-current="step"':''} aria-label="Round ${i+1}${r?', '+fmt(r.points)+' points':current?', current':', not played'}"></span>`;
 }).join('');
}
async function revealHint(){
 if(busy||phase!=='guess'||run.hints[index])return;
 setBusy(true);
 try{
  const data=backend?await api('hint',{runId:run.id,index}):{hint:offlineClues.find(c=>c.id===run.ids[index]).hint};
  run.hints[index]=true;run.hintTexts[index]=data.hint;
  $('hint-text').hidden=false;$('hint-text').textContent=data.hint;
  $('hint-btn').innerHTML=icon('bulb')+'<span>Hint used</span>';
  $('hint-btn').setAttribute('aria-expanded','true');persist();
  announce('Hint: '+data.hint+' 500 points will be deducted.');
 }catch(e){showError(e);}finally{setBusy(false);}
}
function focusRound(scroll=false){
 $('question').focus({preventScroll:true});
 if(scroll&&innerWidth<=740)document.querySelector('.game-status').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
}
async function submitGuess(){
 if(busy||!run)return;
 if(phase==='result'){
  if(index===4)phase='summary';else{index++;phase='guess';pin=null;}
  render();persist();focusRound(true);return;
 }
 if(phase!=='guess'||!pin)return;
 setBusy(true);$('guess-btn-text').textContent='Checking…';
 try{
  const r=backend?await api('guess',{runId:run.id,index,lat:pin.lat,lon:pin.lon}):resultLocal(offlineClues.find(c=>c.id===run.ids[index]),pin,run.hints[index]);
  run.results[index]=r;phase='result';persist();render();playTone('reveal');
  announce(`${r.answer.name}. ${r.answer.city}, ${r.answer.country}. ${fmt(r.distance)} kilometers away. ${fmt(r.points)} points.`);
  // Keep the map and next action in place rather than jumping the page after a guess.
  $('guess-btn').focus({preventScroll:true});
 }catch(e){showError(e);$('guess-btn-text').textContent='Submit guess';}finally{setBusy(false);}
}
function resultColor(points){return points>=4000?'#7f9970':points>=2500?'#a9b487':points>=1000?'#d3b77e':'#d29573';}
function resultEmoji(points){return points>=4000?'🟩':points>=2500?'🟨':points>=1000?'🟧':'🟥';}
function miniMap(){const countries=WORLD.map(f=>`<path d="${f.path}" fill="#d2dcc5" stroke="#edf0e4" stroke-width=".9"/>`).join('');const pins=run.results.map((r,i)=>{const p=project(r.answer);return`<circle cx="${p.x}" cy="${p.y}" r="10" fill="#dd7046" stroke="#f7f6e9" stroke-width="2"/><text x="${p.x}" y="${p.y+3.5}" text-anchor="middle" fill="#fffaf0" font-family="Arial" font-size="10">${i+1}</text>`;}).join('');return`<svg viewBox="0 0 1000 530" aria-hidden="true">${countries}${pins}</svg>`;}
function renderSummary(){
 const sum=total(),savedName=readStore('name','');
 $('summary').innerHTML=`<div class="summary-panel">
 <div class="summary-score">${fmt(sum)}<small>/ 25,000</small></div>
 <p class="summary-caption">${run.hints.filter(Boolean).length?run.hints.filter(Boolean).length+' hint'+(run.hints.filter(Boolean).length===1?'':'s')+' used':'No hints used'}</p>
 <div>${run.results.map((r,i)=>`<div class="summary-row"><span class="summary-number">${i+1}</span><div><strong>${esc(r.answer.city)}, ${esc(r.answer.country)}</strong><small>${esc(r.answer.name)} · ${r.distance<1?'&lt; 1':fmt(r.distance)} km</small></div><span>${fmt(r.points)}</span></div>`).join('')}</div>
 <div class="summary-actions"><button id="share-results" class="primary-btn">${icon('share')}Share result</button><button id="download-card" class="secondary-btn" aria-label="Save result image" title="Save result image">${icon('download')}</button><button id="another-round" class="text-btn">${run.mode==='daily'?'Play practice':'Play again'} ${icon('arrow')}</button></div>
 ${run.mode==='daily'?(run.submitted?`<p class="form-note">${icon('check')} Saved as <strong>${esc(run.displayName)}</strong>.</p><button class="secondary-btn" id="summary-board">${icon('trophy')}Leaderboard</button>`:`<details class="save-details" id="save-details"><summary>Save to leaderboard</summary><form class="score-form" id="score-form"><label><span class="visually-hidden">Your name, 2 to 20 characters</span><input id="player-name" type="text" maxlength="20" minlength="2" placeholder="Your name" value="${esc(savedName)}" required autocomplete="nickname"></label><button type="submit" class="secondary-btn">Save score ${icon('arrow')}</button></form><p class="form-note">${backend?'Shared on this server.':'Local scores only. Stored in this browser.'} One entry per day.</p></details>`):''}
 </div>${run.mode==='daily'?'<p class="countdown-note">Next daily in <span id="countdown" class="countdown"></span></p>':''}`;
 $('score-form')?.addEventListener('submit',saveScore);
 $('summary-board')?.addEventListener('click',showLeaderboard);
 $('share-results').onclick=shareResults;$('download-card').onclick=downloadCard;
 $('another-round').onclick=async()=>{await start('practice',true);focusRound(true);};
 updateCountdown();
}
async function saveScore(e){e.preventDefault();if(busy||run.submitted)return;const name=$('player-name').value.trim();if(!/^[\p{L}\p{N} _.-]{2,20}$/u.test(name)){toast('Use 2–20 letters, numbers, spaces, dots, underscores, or hyphens.');$('player-name').focus();return;}setBusy(true);const btn=e.currentTarget.querySelector('button');btn.disabled=true;try{let savedName=name;if(backend){const saved=await api('submit',{runId:run.id,name});savedName=saved.name;}else{const board=readStore('board',[]).filter(r=>r.id!==run.id);board.push({id:run.id,date:run.date,name,score:total(),completedAt:Date.now()});if(!writeStore('board',board.slice(-365)))throw Error('Your score could not be saved. Browser storage is unavailable. You can try again.');}run.submitted=true;run.displayName=savedName;writeStore('name',savedName);persist();renderSummary();toast(backend?'Your score is on the daily board.':'Your score is saved to this browser.');}catch(e){showError(e);btn.disabled=false;}finally{setBusy(false);}}
let dialogReturnFocus=null;
function closeMenu(restore=false){
 $('options-menu').hidden=true;$('menu-btn').setAttribute('aria-expanded','false');
 if(restore)$('menu-btn').focus({preventScroll:true});
}
function openDialog(html,className=''){
 const fromMenu=!$('options-menu').hidden;
 const d=$('dialog');
 if(!d.open)dialogReturnFocus=fromMenu?$('menu-btn'):document.activeElement;
 closeMenu();
 d.className='dialog '+className;$('dialog-content').innerHTML=html;
 const heading=$('dialog-content').querySelector('h2');
 if(heading){heading.id='dialog-title';d.setAttribute('aria-labelledby','dialog-title');d.removeAttribute('aria-label');}
 else{d.removeAttribute('aria-labelledby');d.setAttribute('aria-label','Clue illustration');}
 if(!d.open)d.showModal();
 icons(d);
}
function closeDialog(){$('dialog').close();}
function showHelp(){
 openDialog(`<h2>How to play</h2>
 <div class="how-step"><span>1</span><div><h3>Look at the clue.</h3><p>Guess the city behind the food, sign, or landmark.</p></div></div>
 <div class="how-step"><span>2</span><div><h3>Place your pin.</h3><p>Click the map or search for a city. Then submit.</p></div></div>
 <div class="how-step"><span>3</span><div><h3>Get closer. Score higher.</h3><p>Five rounds. Up to 5,000 points each. Hints cost 500.</p></div></div>
 <details class="help-details"><summary>Controls & scoring</summary><p>Drag to pan. Scroll or pinch to zoom. A guess within 25 km earns full points. Beyond that, scores decrease with distance. There is no timer penalty.</p><div class="keyboard-guide"><kbd>/</kbd><span>Search</span><kbd>← ↑ ↓ →</kbd><span>Move pin with map focused</span><kbd>+ −</kbd><span>Zoom</span><kbd>0</kbd><span>Reset map</span><kbd>Enter</kbd><span>Submit or continue</span><kbd>H</kbd><span>Use hint (−500 points)</span></div><p>Daily resets at 00:00 UTC. Practice is unranked. Progress saves ${backend?'on this server':'in this browser'}.</p></details>
 <button id="help-done" class="primary-btn">Play ${icon('arrow')}</button>`);
 $('help-done').onclick=closeDialog;
}
function showAbout(){
 openDialog(`<h2>About Origin</h2><p>${offlineClues?offlineClues.length:''} clues: food, street signs, and landmarks. Five new ones each day, plus unlimited practice.</p>
 <p>Food clues target a city or regional association, not necessarily a single birthplace. Signs and landmarks are stylized. Each revealed answer includes a source.</p>
 <p>Map: <a href="https://www.naturalearthdata.com/about/terms-of-use/" target="_blank" rel="noopener noreferrer">Natural Earth · public domain</a>. Simplified outlines, not a street map.</p>
 <details class="help-details"><summary>Privacy & scoring</summary><p>${backend?'This server stores an anonymous cookie, game progress, and names and scores you submit. The board is shared only with players on this server.':'Progress and leaderboard scores stay in this browser. No data is sent during standalone play. Source links open external websites.'}</p><p>Within 25 km: 5,000 points. Otherwise: round(5,000 × exp(−(distance − 25) / 2,200)). A hint subtracts 500, down to a minimum of zero. Great-circle distance uses a 6,371.0088 km Earth radius.</p><p>Clearing storage can create a new player identity.</p></details>`);
}
async function showLeaderboard(){
 const date=run?.date||today();
 openDialog(`<h2>Leaderboard</h2><p class="dialog-sub">${dateLabel(date,true)} · ${backend?'This server':'This browser only'}</p><div id="board-content"><p>Loading…</p></div>`);
 try{
  let entries;
  if(backend){const d=await api('leaderboard?date='+encodeURIComponent(date));entries=d.entries;}
  else entries=readStore('board',[]).filter(r=>r.date===date).sort((a,b)=>b.score-a.score||a.completedAt-b.completedAt).map((r,i)=>({...r,rank:i+1,me:r.id===run?.id}));
  if(!$('board-content'))return;
  $('board-content').innerHTML=entries.length?'<div class="board-header"><span>Player</span><span>Points</span></div>'+entries.map(r=>`<div class="board-row ${r.me?'me':''}"><span class="board-rank">${r.rank}</span><span class="board-name">${esc(r.name)}${r.me?'<small>You</small>':''}</span><strong class="board-score">${fmt(r.score)}</strong></div>`).join(''):`<div class="board-empty">${icon('trophy')}<h3>No scores yet</h3><p>Finish today’s five rounds to add yours.</p></div>`;
  $('board-content').insertAdjacentHTML('beforeend',`<p class="fine-print">${backend?'One daily entry per browser. Ties use completion time.':'Scores stay in this browser.'}</p>`);
 }catch(e){
  if($('board-content'))$('board-content').innerHTML=`<p>${esc(e.message)}</p><button class="secondary-btn" id="retry-board">Try again</button>`;
  $('retry-board')?.addEventListener('click',showLeaderboard);
 }
}
function shareText(){return`origin. ${run.mode==='daily'?'Daily':'Practice'} · ${dateLabel(run.date,true)}\n${run.results.map(r=>resultEmoji(r.points)).join('')}\n${fmt(total())} / 25,000 points\n${run.hints.filter(Boolean).length} hint${run.hints.filter(Boolean).length===1?'':'s'} used${backend&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'?'\n'+location.origin:location.hostname==='games.ludvighedin.com'?'\nhttps://games.ludvighedin.com/origin/':''}`;}
async function shareResults(){const text=shareText();try{if(navigator.share){await navigator.share({title:'Origin',text});return;}if(navigator.clipboard){await navigator.clipboard.writeText(text);toast('Result copied.');return;}throw Error('clipboard unavailable');}catch(e){if(e.name==='AbortError')return;openDialog(`<h2>Share result</h2><p>Select and copy your result. No spoilers.</p><textarea id="copy-text" class="copy-box" readonly aria-label="Results to copy">${esc(text)}</textarea>`);$('copy-text').focus();$('copy-text').select();}}
function downloadCard(){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const ctx=canvas.getContext('2d');ctx.fillStyle='#f7f6f0';ctx.fillRect(0,0,1080,1350);ctx.strokeStyle='#e4774b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(109,111,21,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#e4774b';ctx.beginPath();ctx.arc(109,111,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2d3c32';ctx.font='bold 54px Georgia';ctx.fillText('origin.',152,129);ctx.font='18px Arial';ctx.fillStyle='#8a967d';ctx.fillText(dateLabel(run.date),78,210);ctx.font='64px Georgia';ctx.fillStyle='#2d3c32';ctx.fillText(run.mode==='daily'?'Daily':'Practice',76,326);ctx.fillStyle='#49715b';ctx.font='152px Georgia';ctx.fillText(fmt(total()),74,534);ctx.fillStyle='#8c9980';ctx.font='27px Arial';ctx.fillText('OUT OF 25,000 POINTS',81,585);run.results.forEach((r,i)=>{ctx.fillStyle=resultColor(r.points);ctx.beginPath();ctx.roundRect(82+i*183,639,157,58,9);ctx.fill();ctx.fillStyle='#fffef4';ctx.font='21px Arial';ctx.textAlign='center';ctx.fillText(fmt(r.points),160+i*183,676);});ctx.textAlign='left';ctx.save();ctx.translate(69,748);ctx.scale(.94,.94);ctx.fillStyle='#d9e0ce';ctx.strokeStyle='#f7f6f0';ctx.lineWidth=1;for(const f of WORLD){const p=new Path2D(f.path);ctx.fill(p);ctx.stroke(p);}ctx.restore();ctx.fillStyle='#8a967d';ctx.font='20px Arial';ctx.fillText(`${run.hints.filter(Boolean).length} hint${run.hints.filter(Boolean).length===1?'':'s'} used`,82,1250);canvas.toBlob(blob=>{if(!blob){toast('Could not create the result card. Try sharing text instead.');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`origin-${run.date}.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Result image saved.');},'image/png');}
function updateCountdown(){
 const now=new Date(),next=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+1),s=Math.max(0,Math.floor((next-now)/1000));
 if($('countdown'))$('countdown').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');
 if(run?.mode==='daily'&&run.date!==now.toISOString().slice(0,10)){
  $('banner').hidden=false;
  if(!$('new-daily')){
   $('banner').innerHTML='A new daily is ready. <button id="new-daily">Play today</button>';
   $('new-daily').onclick=()=>{serverDay=new Date().toISOString().slice(0,10);$('banner').hidden=true;start('daily',true);};
  }
 }
}
function bind(){
 icons();
 $('logo').onclick=e=>{e.preventDefault();start('daily');};
 $('daily-nav').onclick=()=>start('daily');$('practice-nav').onclick=()=>start('practice');
 $('menu-btn').onclick=()=>{const open=$('options-menu').hidden;$('options-menu').hidden=!open;$('menu-btn').setAttribute('aria-expanded',String(open));};
 $('menu-btn').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();$('options-menu').hidden=false;$('menu-btn').setAttribute('aria-expanded','true');$('leaderboard-nav').focus();}});
 $('options-menu').addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();closeMenu(true);}
  if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
   e.preventDefault();const buttons=[...$('options-menu').querySelectorAll('button')];const i=buttons.indexOf(document.activeElement);
   buttons[e.key==='Home'?0:e.key==='End'?buttons.length-1:mod(i+(e.key==='ArrowDown'?1:-1),buttons.length)].focus();
  }
 });
 $('leaderboard-nav').onclick=showLeaderboard;$('help-btn').onclick=showHelp;$('about-btn').onclick=showAbout;
 $('hint-btn').onclick=revealHint;$('guess-btn').onclick=submitGuess;
 $('dialog-close').onclick=closeDialog;
 $('dialog').addEventListener('close',()=>{if(dialogReturnFocus?.isConnected)dialogReturnFocus.focus({preventScroll:true});});
 $('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
 $('expand-btn').onclick=()=>{
  const c=run.clues[index];
  openDialog(`<div class="dialog-art" role="img" aria-label="${esc(c.description)}">${clueArt(c)}</div>`,'image-dialog');
 };
 $('city-search').addEventListener('input',doSearch);
 $('city-search').addEventListener('focus',()=>{if($('city-search').value)doSearch();});
 $('city-search').addEventListener('keydown',e=>{
  if(e.key==='Escape'){hideSearch();return;}
  if(e.key==='Enter'){e.preventDefault();e.stopPropagation();if(!$('search-results').hidden&&searchMatches.length)selectCity(searchIndex>=0?searchIndex:0);return;}
  if(['ArrowDown','ArrowUp'].includes(e.key)){
   e.preventDefault();if(!searchMatches.length)return;
   searchIndex=mod(searchIndex+(e.key==='ArrowDown'?1:-1),searchMatches.length);
   document.querySelectorAll('.search-result').forEach((el,i)=>{el.classList.toggle('selected',i===searchIndex);el.setAttribute('aria-selected',String(i===searchIndex));});
   const target=$('search-opt-'+searchIndex);$('city-search').setAttribute('aria-activedescendant',target.id);target.scrollIntoView({block:'nearest'});
  }
 });
 document.addEventListener('pointerdown',e=>{
  if(!$('map-search').contains(e.target))hideSearch();
  if(!document.querySelector('.menu-wrap').contains(e.target))closeMenu();
 });
 document.addEventListener('focusin',e=>{if(!document.querySelector('.menu-wrap').contains(e.target))closeMenu();});
 document.addEventListener('keydown',e=>{
  if($('dialog').open||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Escape'&&!$('options-menu').hidden){closeMenu(true);return;}
  if(!$('options-menu').hidden||/^(INPUT|TEXTAREA|BUTTON|SUMMARY|A)$/i.test(e.target.tagName))return;
  if(e.key==='/'&&phase==='guess'){e.preventDefault();$('city-search').focus();}
  if(e.key==='Enter'&&phase!=='summary'&&!$('guess-btn').disabled){e.preventDefault();submitGuess();}
  if(e.key.toLowerCase()==='h'&&phase==='guess')revealHint();
 });
 sound=readStore('sound',false);updateSound();
 $('sound-btn').onclick=()=>{sound=!sound;writeStore('sound',sound);updateSound();if(sound)playTone('reveal');};
}
function updateSound(){
 $('sound-btn').innerHTML=icon(sound?'volume':'volume-off')+`<span>Sound ${sound?'on':'off'}</span>`;
 $('sound-btn').setAttribute('aria-pressed',String(sound));
}
async function boot(){
 bind();initMap();
 if(!offlineClues){
  try{const health=await api('health');backend=health.ok===true;serverDay=health.date;}
  catch(e){
   $('banner').hidden=false;
   $('banner').innerHTML='Start the included server with <code>python3 server.py</code>, or open <strong>Origin.html</strong> for offline play.';
   $('clue-description').textContent='Connect to the server to play.';return;
  }
 }
 await start('daily');updateCountdown();setInterval(updateCountdown,1000);
}
boot();
</script>
