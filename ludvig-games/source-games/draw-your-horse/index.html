<script>
'use strict';
// All visible graphics and controls are Canvas. Native invisible controls provide
// text entry, mobile keyboards and keyboard/screen-reader access. Network is used only for
// optional online rooms through Ludvig.mp (docs/platform-api.md); single-player stays offline.
// The drawing is the horse: no tracing, smoothing, invented limbs, or external assets.
const DW=720,DH=420;
const spriteCache=new WeakMap();
const HORSE_EPITHETS=['Har aldrig läst reglerna.','Ritad med självförtroende.','Mamma säger att det är en häst.','Vann på teknikalitet.','Anatomiskt diskussionsunderlag.','Inte byggd för kurvor.','Veterinären har frågor.','Född att förvirra.'];
function modelClamp(v,a,b){return Math.max(a,Math.min(b,v));}
function modelRng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t^=t+Math.imul(t^(t>>>7),61|t);return((t^(t>>>14))>>>0)/4294967296;};}
function randomHorseName(){const a=['Sir','Professor','Kapten','Lilla','Doktor','Lord','Turbo','Absolut'];const b=['Spagetti','Knäproblem','Grus','Macka','Hovlös','Ångest','Lasagne','Banan'];return a[Math.random()*a.length|0]+' '+b[Math.random()*b.length|0];}
function paintStrokes(ctx,strokes){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  for(const s of strokes){
    if(!s.points.length)continue;
    ctx.strokeStyle=ctx.fillStyle=s.color;ctx.lineWidth=s.size;
    if(s.points.length===1){ctx.beginPath();ctx.arc(s.points[0].x,s.points[0].y,s.size/2,0,Math.PI*2);ctx.fill();continue;}
    ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
    for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);
    ctx.stroke();
  }ctx.restore();
}
function modelRaster(strokes){const c=document.createElement('canvas');c.width=DW;c.height=DH;paintStrokes(c.getContext('2d'),strokes);return c;}
function analyzeHorse(strokes){
  const c=modelRaster(strokes),data=c.getContext('2d').getImageData(0,0,DW,DH).data;
  let x0=DW,y0=DH,x1=-1,y1=-1,ink=0;
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++)if(data[(y*DW+x)*4+3]>0){ink++;x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
  if(!ink)return null;
  const bounds={x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
  let lower=0;const bottom=Math.floor(y0+bounds.h*.7);
  for(let y=bottom;y<=y1;y++)for(let x=x0;x<=x1;x++)if(data[(y*DW+x)*4+3]>0)lower++;
  const aspect=bounds.w/bounds.h,density=ink/(bounds.w*bounds.h),stat=v=>Math.round(modelClamp(v,8,98));
  const stats={speed:stat(60+20*Math.log2(aspect)),stamina:stat(37+Math.min(38,Math.sqrt(ink/7000)*20)+density*16),legs:stat(25+lower/ink*135+Math.min(10,bounds.h/35)),chaos:stat(18+Math.sqrt(strokes.length)*13),weight:stat(12+Math.min(70,ink/180)+density*12)};
  const tier=aspect>2.4?'S-tier noodle':stats.weight>73?'Absolute unit':strokes.length===1?'One-line wonder':stats.legs>77?'Too many knees':'Legally a horse';
  const epithet=HORSE_EPITHETS[(ink+strokes.length*17+bounds.w)%HORSE_EPITHETS.length];
  return{stats,bounds,ink,tier,epithet};
}
function buildHorse(strokes,name,id,seed){
  const copy=strokes.map(s=>({color:s.color,size:s.size,points:s.points.map(p=>({x:p.x,y:p.y}))}));
  const info=analyzeHorse(copy);if(!info)return null;
  const actualSeed=seed===undefined?(Math.random()*4294967296)>>>0:seed>>>0;
  return{id:id||'h-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name:String(name||'').trim().slice(0,28)||randomHorseName(),strokes:copy,...info,epithet:HORSE_EPITHETS[modelRng(actualSeed)()*HORSE_EPITHETS.length|0],seed:actualSeed,wins:0,races:0};
}
function prepareSprite(horse){
  if(spriteCache.has(horse))return spriteCache.get(horse);
  const full=modelRaster(horse.strokes),b=horse.bounds,pad=5,c=document.createElement('canvas');
  c.width=b.w+pad*2;c.height=b.h+pad*2;c.getContext('2d').drawImage(full,b.x,b.y,b.w,b.h,pad,pad,b.w,b.h);spriteCache.set(horse,c);return c;
}
function horseSprite(ctx,horse,x,groundY,maxW,maxH,time=0,motion=0,event=null){
  const c=prepareSprite(horse),scale=Math.min(maxW/c.width,maxH/c.height),w=c.width*scale,h=c.height*scale;
  const moving=modelClamp(motion,0,1),phase=time*(12+horse.stats.legs*.05)+(horse.seed%997),beat=Math.sin(phase),bounce=Math.abs(beat)*Math.min(9,h*.1)*moving;
  const stumble=event==='stumble',backwards=event==='backwards';
  ctx.save();ctx.translate(x,groundY-bounce);ctx.rotate((Math.sin(phase*.5)*.055+beat*.024)*moving+(stumble?.18:0));
  ctx.scale((backwards?-1:1)*(1+beat*.055*moving),1-beat*.065*moving);ctx.drawImage(c,-w/2,-h,w,h);ctx.restore();
}
function makeBots(){
  const specs=[
    ['Sir Spagetti','#30302b',0],['Hovlös & rädd','#e56a46',1],['Långhalsen','#426c87',2],['Kartong-Kent','#4d6857',3],
    ['Pinne McPinne','#7b596e',4],['Potatis Deluxe','#a77634',5],['Flerben AB','#40403b',6],['Lilla katastrofen','#526979',7]
  ];
  return specs.map(([name,color,kind],index)=>{
    const rng=modelRng(9201+index*193),strokes=[];
    function path(points,size=7,jitter=1.7){const ps=[];for(let i=0;i<points.length;i++){const p=points[i];if(i){const a=points[i-1],n=Math.max(1,Math.ceil(Math.hypot(p[0]-a[0],p[1]-a[1])/15));for(let k=1;k<n;k++)ps.push({x:a[0]+(p[0]-a[0])*k/n+(rng()-.5)*jitter,y:a[1]+(p[1]-a[1])*k/n+(rng()-.5)*jitter});}ps.push({x:p[0]+(rng()-.5)*jitter,y:p[1]+(rng()-.5)*jitter});}strokes.push({color,size,points:ps});}
    function oval(cx,cy,rx,ry,size=7){const ps=[];for(let i=0;i<=36;i++){const a=i/36*Math.PI*2;ps.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}path(ps,size,2.8);}
    function eye(x,y){path([[x,y]],9,0);}
    function tail(x,y){path([[x,y],[x-30,y-28],[x-47,y+5],[x-35,y+26]],6);}
    function legs(xs,y,bottom=335){xs.forEach((x,i)=>path([[x,y],[x+(i%2?14:-12),(y+bottom)/2],[x+(i%2?-5:8),bottom],[x+22,bottom+2]],7));}
    if(kind===0){
      // A horse that is mostly horizontal.
      path([[100,190],[160,175],[435,178],[466,120],[475,94],[489,115],[522,111],[556,140],[552,165],[516,168],[491,206],[450,231],[167,233],[100,211],[100,190]]);
      legs([140,198,416,456],232,303);tail(102,194);eye(516,135);path([[474,121],[465,150],[454,177]],10);
    }else if(kind===1){
      // Impossibly large torso, apologetically tiny legs.
      oval(290,216,161,74);path([[409,183],[443,125],[460,111],[465,83],[482,109],[522,115],[543,142],[532,163],[490,167],[456,207]]);
      legs([208,245,350,386],276,308);tail(132,209);eye(505,133);path([[455,122],[447,152]],11);
    }else if(kind===2){
      // Long neck. No giraffes were consulted.
      oval(277,252,112,52);path([[362,240],[386,106],[404,65],[418,62],[426,39],[441,64],[484,79],[503,101],[481,120],[439,110],[426,259]]);
      legs([208,244,326,357],291,361);tail(164,244);eye(464,88);path([[386,118],[390,166],[379,201]],9);
    }else if(kind===3){
      path([[170,170],[400,170],[426,121],[491,121],[491,163],[452,166],[434,251],[171,251],[170,170]]);
      legs([200,238,369,411],253,338);path([[426,120],[424,96],[443,119]]);tail(168,181);eye(472,138);
      path([[179,185],[394,187]],3);path([[418,179],[426,155]],10);
    }else if(kind===4){
      path([[177,233],[403,232],[447,147],[490,149]]);path([[447,147],[446,119],[459,142],[506,147],[516,169],[488,181],[462,170]]);
      path([[210,231],[186,285],[158,344]]);path([[250,232],[270,286],[261,347]]);path([[362,233],[351,288],[328,343]]);path([[398,235],[423,287],[443,341]]);
      tail(177,231);eye(493,160);path([[443,151],[430,173]],12);
    }else if(kind===5){
      oval(301,230,151,95,9);path([[419,179],[443,145],[482,143],[485,120],[501,146],[535,159],[544,187],[523,210],[476,207],[447,241]],8);
      legs([218,271,350,393],312,345);tail(151,219);eye(515,171);path([[454,150],[443,174]],9);
    }else if(kind===6){
      oval(292,213,143,62);path([[406,179],[431,123],[451,107],[455,83],[472,106],[517,116],[531,143],[516,159],[475,159],[440,221]]);
      legs([180,219,258,297,336,375,408],261,331);tail(148,207);eye(505,131);path([[445,127],[432,160]],11);
    }else{
      oval(295,228,73,50);path([[345,206],[379,156],[402,157],[408,139],[420,157],[455,179],[447,195],[413,199],[367,244]]);
      legs([246,276,326,346],271,335);tail(221,226);eye(431,175);path([[379,164],[365,189]],9);path([[294,217],[305,222],[298,235]],4);
    }
    const h=buildHorse(strokes,name,'bot-'+index,1000+index*719);h.bot=true;return h;
  });
}

/* Seeded, UI-independent race simulation. All time values are seconds. */
function makeRace(entrants, seed = 1) {
  if (!Array.isArray(entrants) || !entrants.length) throw new Error('Race needs horses.');
  let state = Number(seed) >>> 0, nextSnapshot = 0, nextComment = 2, winnerAnnounced = false;
  const random = () => {
    let t = state += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const stat = (horse, key) => Math.max(0, Math.min(100, Number(horse.stats?.[key]) || 0));
  const pick = list => list[Math.floor(random() * list.length)];
  const race = {
    time: 0, distance: 2000, finished: false, results: [], snapshots: [], logs: [],
    lastComment: 'Sju hästar. Tveksam anatomi. Nu kör vi.', lastEvent: null,
    photoFinish: false,
    runners: entrants.map((horse, index) => ({
      horse, index, x: 0, speed: 0, finish: null, event: null,
      eventUntil: 0, boostUntil: 0, phase: random() * Math.PI * 2,
      base: 64 + stat(horse, 'speed') * .115 + stat(horse, 'legs') * .035
        - stat(horse, 'weight') * .018 + (random() - .5) * 5,
      nextEvent: 2.5 + random() * 4.5, nextCheer: 0
    })),
    get cheerReady() { return this.readyFor(0); },
    get nextCheer() { return this.runners[0].nextCheer; },
    get commentary() { return this.lastComment; },
    readyFor(i) { const r = this.runners[i]; return !!r && !this.finished && r.finish === null && this.time >= r.nextCheer; },
    cheer(i = 0) {
      if (!this.readyFor(i)) return false;
      const r = this.runners[i];
      r.nextCheer = this.time + 2.8;
      r.boostUntil = this.time + 1.15;
      this.logs.push({ time: this.time, type: 'cheer', index: i, text: 'HEJA!' });
      return true;
    },
    step(dt) {
      if (this.finished || !Number.isFinite(dt) || dt <= 0) return;
      // Splitting protects crossing times and events if a caller passes a long frame.
      for (let remaining = Math.min(dt, 1); remaining > 1e-8 && !this.finished;) {
        const h = Math.min(remaining, 1 / 60); remaining -= h; tick(h);
      }
    }
  };
  const compare = (a, b) => a.finish - b.finish || a.index - b.index;
  function say(text, type = 'comment', index = -1) {
    race.lastComment = text;
    race.lastEvent = { time: race.time, type, index, text };
    race.logs.push(race.lastEvent);
  }
  function snapshot() {
    race.snapshots.push({ time: race.time, commentary: race.lastComment,
      cheerReady: race.cheerReady, nextCheer: race.nextCheer,
      runners: race.runners.map(r => ({ x: r.x, speed: r.speed, finish: r.finish,
        event: r.event, eventUntil: r.eventUntil, boostUntil: r.boostUntil, phase: r.phase })) });
  }
  function tick(dt) {
    const oldTime = race.time; race.time += dt;
    for (const r of race.runners) {
      if (r.finish !== null) {
        r.speed *= Math.exp(-dt * 2); r.x = Math.min(race.distance + 60, r.x + r.speed * dt);
        continue;
      }
      if (r.event && race.time >= r.eventUntil) r.event = null;
      if (race.time >= r.nextEvent && race.time < 36) {
        const chaos = stat(r.horse, 'chaos') / 100;
        const roll = random();
        r.event = roll < .43 + chaos * .12 ? 'sprint' : roll < .82 ? 'stumble' : 'backwards';
        r.eventUntil = race.time + (r.event === 'sprint' ? 1.2 + random() * .5 : .55 + random() * .4);
        r.nextEvent = race.time + 5 + random() * 4 - chaos * 1.7;
        const lines = {
          sprint: ['har hittat sportläget!', 'har tydligen en motor.', 'springer som om hyran ska betalas.'],
          stumble: ['har glömt hur ben fungerar.', 'snubblade på sitt självförtroende.', 'buffrar.'],
          backwards: ['har valt fel håll.', 'backar in i framtiden.', 'ångrar sig mitt i loppet.']
        };
        if (race.time >= nextComment || r.index === 0) {
          say(`${r.horse.name} ${pick(lines[r.event])}`, r.event, r.index);
          nextComment = race.time + 1.35;
        }
      }
      const progress = Math.min(1, r.x / race.distance);
      const fatigue = 1 - Math.max(0, progress - .45) * (1 - stat(r.horse, 'stamina') / 100) * .16;
      const surge = 1 + Math.sin(race.time * .95 + r.phase) * .045;
      let factor = r.event === 'sprint' ? 1.43 : r.event === 'stumble' ? .22 : r.event === 'backwards' ? -.38 : 1;
      if (race.time < r.boostUntil) factor += .17;
      r.speed = r.base * fatigue * surge * factor;
      const oldX = r.x; r.x = Math.max(0, oldX + r.speed * dt);
      if (oldX < race.distance && r.x >= race.distance) {
        r.finish = oldTime + dt * (race.distance - oldX) / (r.x - oldX);
        r.event = null;
      }
    }
    // Defensive deadline: preserve the order of estimated arrivals, never leave a race stuck.
    if (race.time >= 43) {
      const pending = race.runners.filter(r => r.finish === null).sort((a, b) =>
        (race.distance - a.x) / a.base - (race.distance - b.x) / b.base || a.index - b.index);
      pending.forEach((r, i) => { r.finish = oldTime + dt * (i + 1) / (pending.length + 1); r.x = race.distance; r.event = null; });
    }
    const finishers = race.runners.filter(r => r.finish !== null).sort(compare);
    if (finishers.length && !winnerAnnounced) {
      winnerAnnounced = true;
      say(`${finishers[0].horse.name} är i mål! Domarna räknar ben.`, 'finish', finishers[0].index);
    }
    race.photoFinish = finishers.length > 1 && finishers[1].finish - finishers[0].finish < .18;
    if (finishers.length === race.runners.length) {
      race.results = finishers; race.finished = true;
      say(race.photoFinish ? 'MÅLFOTO! En nos avgjorde. Om det där var en nos.'
        : `${finishers[0].horse.name} vinner! Hästdefinitionen är fortfarande under utredning.`, 'result', finishers[0].index);
    }
    if (race.time + 1e-8 >= nextSnapshot || race.finished) {
      snapshot(); nextSnapshot = race.time + 1 / 15;
    }
  }
  snapshot(); nextSnapshot = 1 / 15;
  return race;
}

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const nameInput=document.getElementById('name'),live=document.getElementById('live');
const P={paper:'#f8f5ed',ink:'#272a24',muted:'#73776a',line:'#d9d9ca',red:'#e65e43',yellow:'#f7cf59',green:'#537b5b',blue:'#527b9c',white:'#fffdf7'};
const palette=[P.ink,P.red,P.blue,P.green,'#a76c9e','#bd803d'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=0,H=0,dpr=1,left=0,cw=0,mobile=false,screen='draw',hits=[],focusId='',hoverId='';
let pointCount=0,layoutScreen='';
let strokes=[],redo=[],cleared=null,activePointer=null,pen=palette[0],brush=7,drawRect=null,sliderRect=null;
let player=null,race=null,record=null,replayClock=0,replaySpeed=1,replayPaused=false,countdown=0,finishHold=0;
let stablePage=0,backScreen='draw',toast='',toastUntil=0,clock=0,paused=false,statsSaved=false;
let storageOK=true,loadWarning='',lastAudioBeat=-1,lastComment='',lastCount=4,shareImage=null;
const inkCanvas=document.createElement('canvas');inkCanvas.width=DW;inkCanvas.height=DH;
const inkCtx=inkCanvas.getContext('2d');
const STORE='draw-your-horse.v1';
function tell(t){toast=t;toastUntil=clock+4;live.textContent=t;}
function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);}
function cleanStrokes(a){
 if(!Array.isArray(a)||a.length>2000)return null;
 let total=0;const out=[];
 for(const s of a){if(!s||!/^#[0-9a-f]{6}$/i.test(s.color)||!Number.isFinite(s.size)||!Array.isArray(s.points))return null;
  const points=[];for(const p of s.points){if(!p||!Number.isFinite(p.x)||!Number.isFinite(p.y)||++total>120000)return null;points.push({x:clamp(p.x,0,DW),y:clamp(p.y,0,DH)});}
  if(points.length)out.push({color:s.color,size:clamp(s.size,1,30),points});
 }return out;
}
function readStable(){
 try{const raw=localStorage.getItem(STORE);if(!raw)return [];const data=JSON.parse(raw);if(data.version!==1||!Array.isArray(data.horses))throw Error();
  return data.horses.map(h=>{const ss=cleanStrokes(h.strokes);if(!ss||!ss.length)return null;
   const horse=buildHorse(ss,String(h.name||'Mystisk häst').slice(0,26),String(h.id||uid()),Number(h.seed)||1);
   if(!horse)return null;horse.wins=Math.max(0,Math.floor(Number(h.wins)||0));horse.races=Math.max(horse.wins,Math.floor(Number(h.races)||0));return horse;
  }).filter(Boolean);
 }catch(e){storageOK=false;loadWarning='Stallet kunde inte läsas. Nya hästar sparas bara denna session.';return [];}
}
let stable=readStable();
const bots=makeBots();
function persist(){
 if(!storageOK){tell('Stallet finns bara i denna session. Webbläsarlagring är blockerad.');return false;}
 try{localStorage.setItem(STORE,JSON.stringify({version:1,horses:stable}));return true;}
 catch(e){storageOK=false;tell('Stallet är fullt eller blockerat. Hästen finns kvar tills sidan stängs.');return false;}
}
function saveHorse(h){if(!stable.some(x=>x.id===h.id))stable.unshift(h);persist();}
function rebuildInk(){pointCount=strokes.reduce((n,s)=>n+s.points.length,0);inkCtx.clearRect(0,0,DW,DH);paintStrokes(inkCtx,strokes);}
function newDrawing(){screen='draw';strokes=[];redo=[];cleared=null;nameInput.value='';player=null;rebuildInk();drawRect=null;nameInput.blur();markDrawing();}
function finishDrawing(){
 endStroke();const h=buildHorse(strokes.map(s=>({color:s.color,size:s.size,points:s.points.map(p=>({...p}))})),nameInput.value,uid(),Math.floor(Math.random()*2147483647));
 if(!h){tell('En prick räcker. Men rita åtminstone något.');return;}player=h;nameInput.value=h.name;saveHorse(h);screen='card';nameInput.blur();sound('ding');
}
function startRace(){
 if(!player)return;if(room){toLobby();return;}nameInput.blur();meIdx=0;mpRole='';const old=stable.filter(h=>h.id!==player.id).sort(()=>Math.random()-.5).slice(0,2);
 const pool=bots.slice().sort(()=>Math.random()-.5);race=makeRace([player,...old,...pool.slice(0,6-old.length)],Math.floor(Math.random()*2147483647));
 screen='race';countdown=3;finishHold=0;paused=false;lastCount=4;lastAudioBeat=-1;lastComment='';statsSaved=false;record=null;shareImage=null;sound('tick');
}
function completeRace(){
 if(statsSaved)return;statsSaved=true;const n=race.runners.length,mine=race.runners[meIdx],pos=race.results.findIndex(r=>r===mine)+1;
 const horse=mine.horse;horse.races++;if(pos===1)horse.wins++;persist();

const FX_MAX=160,fxPool=[];let fxCount=0,fxClock=0,fxSrc=null,shake=0,rankPop=0,prevRank=0,cheerFx=0;const prevEvent=[],prevDone=[];
function fxReset(src){fxSrc=src;fxCount=0;shake=0;rankPop=0;prevRank=0;cheerFx=0;prevEvent.length=0;prevDone.length=0;}
function fxAdd(wx,lane,dy,vx,vy,life,color,size,kind){if(fxCount>=FX_MAX)return;const p=fxPool[fxCount]||(fxPool[fxCount]={});fxCount++;p.wx=wx;p.lane=lane;p.dy=dy;p.vx=vx;p.vy=vy;p.age=0;p.life=life;p.color=color;p.size=size;p.kind=kind;}
function fxStep(dt){
 for(let i=0;i<fxCount;){const p=fxPool[i];p.age+=dt;if(p.age>=p.life){fxCount--;fxPool[i]=fxPool[fxCount];fxPool[fxCount]=p;continue;}
  p.wx+=p.vx*dt;p.dy+=p.vy*dt;p.vy+=(p.kind==='confetti'?240:p.kind==='dust'?90:-20)*dt;if(p.kind==='confetti')p.vx*=Math.exp(-dt*1.5);i++;}

function fxDraw(world,trackTop,laneH,bottom){
 if(!fxCount)return;ctx.save();ctx.beginPath();ctx.rect(left,80,cw,bottom-80);ctx.clip();
 for(let i=0;i<fxCount;i++){const p=fxPool[i],k=p.age/p.life,x=world(p.wx),y=trackTop+(p.lane+1)*laneH-7+p.dy;
  ctx.globalAlpha=Math.max(0,1-k*k);ctx.fillStyle=p.color;
  if(p.kind==='confetti'){ctx.save();ctx.translate(x,y);ctx.rotate(p.age*8+p.size*3);ctx.fillRect(-p.size/2,-p.size,p.size,p.size*2);ctx.restore();}
  else{ctx.beginPath();ctx.arc(x,y,p.size*(p.kind==='dust'?1+k*1.4:1-k*.6),0,Math.PI*2);ctx.fill();}}
 ctx.globalAlpha=1;ctx.restore();
}

function locationOf(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}

function addPoint(e){if(!drawingStroke||!drawRect)return;const p=locationOf(e),r=drawRect,q={x:Math.round(clamp((p.x-r.x)/r.w*DW,0,DW)*10)/10,y:Math.round(clamp((p.y-r.y)/r.h*DH,0,DH)*10)/10},prev=drawingStroke.points.at(-1);
 if(prev&&Math.hypot(q.x-prev.x,q.y-prev.y)<.45)return;if(pointCount>=120000){tell('Duken är full. Dags att tävla med mästerverket.');return;}drawingStroke.points.push(q);pointCount++;

}

 if(pressed){if(pressed.id!=='name')nameInput.blur();if(pressed.id!=='code')codeInput.blur();return;}
 if(screen==='draw'&&inside(p,sliderRect)){scrollDrag=null;sliding=true;activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);brush=clamp(2+(p.x-sliderRect.x-10)/(sliderRect.w-20)*22,2,24);return;}
 if(screen==='draw'&&inside(p,drawRect)){scrollDrag=null;if(strokes.length>=2000||pointCount>=120000){tell('Duken är full. Dags att tävla.');return;}nameInput.blur();canvas.focus({preventScroll:true});activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);drawingStroke={color:pen,size:Math.round(brush),points:[]};strokes.push(drawingStroke);redo=[];cleared=null;addPoint(e);return;}
 if(e.pointerType==='touch')scrollDrag={y:e.clientY,scroll:scrollY,moved:false};
});
canvas.addEventListener('pointermove',e=>{

let lastFrame=0,acc=0;
function update(dt){

 if(screen==='race'&&mpRole==='client')updateClient(dt);
 else if(screen==='race'&&!paused){
  if(countdown>0){countdown-=dt;const n=Math.ceil(countdown);if(n!==lastCount){lastCount=n;sound(n<=0?'go':'tick');}}
  else if(!race.finished){race.step(dt);raceAudio(race.time);if(race.lastComment!==lastComment){lastComment=race.lastComment;live.textContent=lastComment;if(race.lastEvent?.index===meIdx)sound('event');}}
  else{if(mpRole==='host'&&!mpEndSent)sendEnd();finishHold+=dt;if(finishHold>1.35)completeRace();}
 }else if(screen==='replay'&&!replayPaused){replayClock=Math.min(record.race.time,replayClock+dt*replaySpeed);if(replayClock>=record.race.time)replayPaused=true;}
}
function frame(now){
 const dt=lastFrame?Math.min((now-lastFrame)/1000,.1):0;lastFrame=now;acc+=dt;
 while(acc>=1/60){update(1/60);acc-=1/60;}draw();requestAnimationFrame(frame);
}
if(loadWarning)tell(loadWarning);requestAnimationFrame(frame);
{const code=inviteCode();if(code.length===4&&mpApi())mpConnect('invite',code);else if(code)setInviteUrl(null);}
