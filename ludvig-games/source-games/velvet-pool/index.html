<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b110e">
<title>Velvet Pool</title>
<style>
:root{--bg:#0b110e;--ink:#efe7d4;--muted:#a3ad9f;--line:rgba(239,231,212,.14);--accent:#e6cf9c;--panel:rgba(15,23,19,.95);--bad:#e48a76}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;align-items:center;gap:6px;padding:6px 8px 2px;flex-wrap:wrap;flex:none}
#hud[hidden]{display:none}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:0;background:rgba(239,231,212,.06);color:var(--ink);cursor:pointer;flex:none;padding:0}
.icon:hover{background:rgba(239,231,212,.11)}
.icon svg{width:22px;height:22px}
.chip{flex:0 1 220px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:44px;padding:4px 10px;border-radius:12px;border:1px solid transparent;opacity:.55;transition:opacity .2s,border-color .2s,background .2s}
.chip.on{opacity:1;border-color:var(--line);background:rgba(239,231,212,.06)}
.chip .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;height:9px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.gone{opacity:.16}
#p1{align-items:flex-end;text-align:right}
#p1 .dots{flex-direction:row-reverse}
#status{flex:1.3 1 0;min-width:0;text-align:center;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.alert{color:var(--accent)}
@media (max-width:640px){.chip{flex:1 1 0}#status{order:9;flex-basis:100%;font-size:13px;line-height:18px;min-height:18px}.wide{display:none!important}}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;-webkit-user-select:none;user-select:none}
#power{position:absolute;display:none;border-radius:14px;background:rgba(239,231,212,.06);border:1px solid var(--line);touch-action:none;overflow:hidden;cursor:grab}
#power.show{display:block}
#power.off{opacity:.35}
#powerFill{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(180deg,#e6cf9c,#d07d4f)}
#power.h #powerFill{height:100%;width:0;background:linear-gradient(90deg,#e6cf9c,#d07d4f)}
#power svg{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);color:var(--muted);pointer-events:none}
#power.h svg{transform:translate(-50%,-50%) rotate(90deg)}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));background:rgba(5,9,7,.5);z-index:10;overflow:auto}
#overlay[hidden]{display:none}
#overlay.clear{background:rgba(5,9,7,.25)}
.card{position:relative;width:min(100%,380px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{margin:2px 0 6px;font-size:30px;font-weight:650;letter-spacing:-.01em;text-align:center;white-space:nowrap}
h2{margin:0 0 2px;font-size:22px;font-weight:650;text-align:center}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(239,231,212,.06);font-weight:600;cursor:pointer;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:hover{background:rgba(239,231,212,.11)}
.btn.primary{background:var(--accent);color:#1d1b14;border-color:transparent}
.btn.primary:hover{background:#efdcb0}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:12.5px;cursor:pointer;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.seg button[aria-pressed=true]{background:rgba(230,207,156,.16);border-color:var(--accent)}
.seg svg{width:12px;height:12px;color:var(--accent)}
.muted{color:var(--muted);text-align:center;font-size:14px;margin:0}
.err{color:var(--bad);text-align:center;font-size:14px;margin:0;min-height:19px}
.row{display:flex;gap:8px}.row>*{flex:1}
.icons{display:flex;justify-content:center;gap:8px;margin-top:2px}
input.code{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:600 20px/1 system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;text-align:center;padding:0 8px}
input.code::placeholder{letter-spacing:.05em;font-size:15px;color:var(--muted);text-transform:none}
.codebig{font-size:40px;letter-spacing:.2em;text-align:center;font-weight:700;margin:0}
.x{position:absolute;top:8px;right:8px}
ul.help{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.sep{height:1px;background:var(--line);margin:2px 0}
@media (max-height:460px){.card{gap:7px;padding:14px 16px}h1{font-size:24px;margin:0}.btn{min-height:44px}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>

</svg>
<div id="app">
  <header id="hud" hidden>
    <button class="icon" id="menuBtn" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
    <div class="chip" id="p0"><span class="nm"></span><span class="dots"></span></div>
    <div id="status" aria-live="polite"></div>
    <div class="chip" id="p1"><span class="nm"></span><span class="dots"></span></div>
    <button class="icon wide" id="soundBtn" aria-label="Sound"><svg><use href="#i-sound"/></svg></button>

  </header>
  <main id="stage">
    <canvas id="c" aria-label="Pool table"></canvas>
    <div id="power" role="slider" aria-label="Shot power" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="powerFill"></div><svg><use href="#i-grip"/></svg></div>
  </main>
</div>
<div id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<script>
(() => {
'use strict';
const SLUG = 'velvet-pool', KEY = 'velvet-pool:';
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, v); } catch { /* storage blocked */ } },
};

/* ---------- Table and physics (fixed step, deterministic: only + - * / sqrt) ---------- */
const W = 1000, H = 500, R = 11.25, D = R * 2, CJ = 30, SJ = 21, RAIL = 42;
const HEAD_X = 250, FOOT_X = 750;
const POCKETS = [[-6, -6, 23], [W / 2, -12, 20], [W + 6, -6, 23], [-6, H + 6, 23], [W / 2, H + 12, 20], [W + 6, H + 6, 23]];
const AIMPTS = [[-1, -1], [W / 2, -6], [W + 1, -1], [-1, H + 1], [W / 2, H + 6], [W + 1, H + 1]];
const JAWS = [[CJ, 0], [0, CJ], [W - CJ, 0], [W, CJ], [0, H - CJ], [CJ, H], [W - CJ, H], [W, H - CJ], [W / 2 - SJ, 0], [W / 2 + SJ, 0], [W / 2 - SJ, H], [W / 2 + SJ, H]];
const DT = 1 / 480, VMAX = 2700, MU_S = 1100, MU_R = 95, DAMP = 0.26, STOP = 3, MAX_STEPS = 480 * 40;
const EC = 0.76, ET = 0.96, EB = 0.94, EJ = 0.55;
const COLORS = ['#f2eee2', '#f0bf2c', '#2457b8', '#cf3a2c', '#68409c', '#ea7a22', '#1f8a52', '#8a2e28', '#141414'];
const colorOf = n => COLORS[n > 8 ? n - 8 : n];

const mkBall = (n, x, y) => ({ n, x, y, vx: 0, vy: 0, wx: 0, wy: 0, live: true });
const moving = b => b.vx !== 0 || b.vy !== 0 || b.wx !== 0 || b.wy !== 0;
const cloneBalls = bs => bs.map(b => ({ ...b }));

function bounce(b, nx, ny, e, ev, fx) {
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return;
  const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
  b.vx = -vn * e * nx + vt * ET * tx; b.vy = -vn * e * ny + vt * ET * ty;
  const wn = b.wx * nx + b.wy * ny, wt = b.wx * tx + b.wy * ty;
  b.wx = -wn * 0.3 * nx + wt * ET * tx; b.wy = -wn * 0.3 * ny + wt * ET * ty;
  if (ev.firstHit !== null) ev.rail = true;
  if (fx) fx.hit(1, -vn);
}

function pot(b, k, ev, fx) {
  b.live = false; b.vx = b.vy = b.wx = b.wy = 0;
  ev.pocketed.push(b.n);
  if (fx) fx.pot(b, k);
}

function step(bs, ev, fx) {
  for (let i = 0; i < 16; i++) {
    const b = bs[i];
    if (!b.live || !moving(b)) continue;
    const sx = b.vx - b.wx, sy = b.vy - b.wy, s = Math.sqrt(sx * sx + sy * sy);
    if (s > 1) {
      const dv = MU_S * DT;
      if (dv * 3.5 >= s) {
        const rx = (5 * b.vx + 2 * b.wx) / 7, ry = (5 * b.vy + 2 * b.wy) / 7;
        b.vx = b.wx = rx; b.vy = b.wy = ry;
      } else {
        const ux = sx / s, uy = sy / s;
        b.vx -= ux * dv; b.vy -= uy * dv; b.wx += ux * dv * 2.5; b.wy += uy * dv * 2.5;
      }
    } else {
      const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy), ns = sp - (MU_R + DAMP * sp) * DT;
      if (ns <= STOP) { b.vx = b.vy = b.wx = b.wy = 0; continue; }
      const k = ns / sp; b.vx *= k; b.vy *= k; b.wx = b.vx; b.wy = b.vy;
    }
    b.x += b.vx * DT; b.y += b.vy * DT;
    if (b.y > CJ && b.y < H - CJ) {
      if (b.x < R) { b.x = R; bounce(b, 1, 0, EC, ev, fx); }
      else if (b.x > W - R) { b.x = W - R; bounce(b, -1, 0, EC, ev, fx); }
    }
    if (b.x > CJ && b.x < W - CJ && Math.abs(b.x - W / 2) > SJ) {
      if (b.y < R) { b.y = R; bounce(b, 0, 1, EC, ev, fx); }
      else if (b.y > H - R) { b.y = H - R; bounce(b, 0, -1, EC, ev, fx); }
    }
    if (b.x < CJ + R || b.x > W - CJ - R || b.y < D || b.y > H - D || Math.abs(b.x - W / 2) < SJ + R) {
      for (let j = 0; j < 12; j++) {
        const dx = b.x - JAWS[j][0], dy = b.y - JAWS[j][1], d2 = dx * dx + dy * dy;
        if (d2 < R * R && d2 > 1e-9) {
          const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
          b.x = JAWS[j][0] + nx * R; b.y = JAWS[j][1] + ny * R;
          bounce(b, nx, ny, EJ, ev, fx);
        }
      }
      let near = -1, best = 1e9;
      for (let k = 0; k < 6; k++) {
        const dx = b.x - POCKETS[k][0], dy = b.y - POCKETS[k][1], d2 = dx * dx + dy * dy;
        if (d2 < best) { best = d2; near = k; }
      }
      const pr = POCKETS[near][2];
      if (best < pr * pr || b.x < -R || b.x > W + R || b.y < -R || b.y > H + R) pot(b, near, ev, fx);
    }
  }
  for (let i = 0; i < 15; i++) {
    const a = bs[i];
    if (!a.live) continue;
    const am = moving(a);
    for (let j = i + 1; j < 16; j++) {
      const b = bs[j];
      if (!b.live || (!am && !moving(b))) continue;
      const dx = b.x - a.x;
      if (dx > D || dx < -D) continue;
      const dy = b.y - a.y;
      if (dy > D || dy < -D) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 >= D * D) continue;
      const d = Math.sqrt(d2) || 1e-6, nx = dx / d, ny = dy / d, ov = (D - d) / 2;
      a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
      const vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
      if (vn > 0) {
        const jn = vn * (1 + EB) / 2;
        a.vx -= jn * nx; a.vy -= jn * ny; b.vx += jn * nx; b.vy += jn * ny;
        if (fx) fx.hit(0, vn);
      }
      if (ev.firstHit === null && (a.n === 0 || b.n === 0)) ev.firstHit = a.n === 0 ? b.n : a.n;
    }
  }
}
const anyMoving = bs => { for (let i = 0; i < 16; i++) if (bs[i].live && moving(bs[i])) return true; return false; };
const stopAll = bs => bs.forEach(b => { b.vx = b.vy = b.wx = b.wy = 0; });
const newEvents = rem => ({ firstHit: null, rail: false, pocketed: [], startRem: rem });

function simulate(bs, vx, vy, ev) {
  bs[0].vx = vx; bs[0].vy = vy; bs[0].wx = 0; bs[0].wy = 0;
  let n = 0;
  while (n < MAX_STEPS) { step(bs, ev, null); n++; if ((n & 7) === 0 && !anyMoving(bs)) break; }
  stopAll(bs);
}

/* ---------- Rules (WPA-style eight-ball, no called pockets) ---------- */
const groupOf = n => (n < 8 ? 'solid' : 'stripe');
const groupName = g => (g === 'solid' ? 'Solids' : 'Stripes');
function remainingOf(bs, g) { let c = 0; for (const b of bs) if (b.live && b.n && b.n !== 8 && groupOf(b.n) === g) c++; return c; }
function freeSpot(bs, x, y, skip) {
  for (const b of bs) if (b.live && b.n !== skip) { const dx = b.x - x, dy = b.y - y; if (dx * dx + dy * dy < (D + 0.3) * (D + 0.3)) return false; }
  return true;
}
const inCloth = (x, y) => x >= R && x <= W - R && y >= R && y <= H - R;
function validCue(bs, x, y, kitchen) { return inCloth(x, y) && (!kitchen || x <= HEAD_X) && freeSpot(bs, x, y, 0); }
function placeCue(bs) {
  const q = bs[0]; q.live = true; stopAll([q]);
  for (let r = 0; r < 400; r += 6) for (let a = 0; a < 12; a++) {
    const x = HEAD_X - r * Math.abs(Math.cos(a * 0.5236)), y = H / 2 + r * Math.sin(a * 0.5236);
    if (validCue(bs, x, y, false)) { q.x = x; q.y = y; return; }
  }
}
function respot8(bs) {
  const e = bs[8]; e.live = true; stopAll([e]);
  for (let x = FOOT_X; x < W - R; x += 2) if (freeSpot(bs, x, H / 2, 8)) { e.x = x; e.y = H / 2; return; }
  for (let x = FOOT_X; x > R; x -= 2) if (freeSpot(bs, x, H / 2, 8)) { e.x = x; e.y = H / 2; return; }
}
function legalTargets(bs, S, seat) {
  const g = S.groups[seat];
  if (S.breakShot || !g) return bs.filter(b => b.live && b.n && b.n !== 8);
  const own = bs.filter(b => b.live && b.n && b.n !== 8 && groupOf(b.n) === g);
  return own.length ? own : [bs[8]];
}
function legalFirst(S, n) {
  const g = S.groups[S.turn];
  if (S.breakShot) return true;
  if (!g) return n !== 8;
  return remainingOf(S.balls, g) > 0 ? n !== 8 && groupOf(n) === g : n === 8;
}

function resolve(S, ev) {
  const N = { ...S, groups: [...S.groups], msg: '', seq: S.seq + 1 };
  const bs = N.balls, me = S.turn, opp = 1 - me, g = S.groups[me];
  const pots = ev.pocketed, obj = pots.filter(n => n > 0 && n !== 8), eight = pots.includes(8), scratch = pots.includes(0);
  let foul = '';
  if (scratch) foul = 'scratch';
  else if (ev.firstHit === null) foul = 'no ball hit';
  else if (!S.breakShot) {
    if (!g) { if (ev.firstHit === 8) foul = 'hit the 8 first'; }
    else if (ev.startRem > 0) { if (ev.firstHit === 8 || groupOf(ev.firstHit) !== g) foul = 'wrong ball first'; }
    else if (ev.firstHit !== 8) foul = 'wrong ball first';
    if (!foul && !pots.length && !ev.rail) foul = 'no rail after contact';
  }
  if (eight && !S.breakShot) {
    const legal = !foul && g && ev.startRem === 0;
    N.over = true; N.winner = legal ? me : opp; N.reason = legal ? '' : (foul ? 'foul' : 'early'); N.placing = false; N.kitchen = false;
    return N;
  }
  if (eight) respot8(bs);
  if (!S.breakShot && !g && !foul && obj.length) {
    const t = groupOf(obj[0]); N.groups[me] = t; N.groups[opp] = t === 'solid' ? 'stripe' : 'solid'; N.assigned = true;
  } else N.assigned = false;
  const g2 = N.groups[me];
  const scored = !foul && obj.some(n => !g2 || groupOf(n) === g2);
  if (foul) { N.turn = opp; N.placing = true; N.msg = 'Foul: ' + foul; if (!bs[0].live) placeCue(bs); }
  else if (!scored) { N.turn = opp; N.placing = false; }
  else N.placing = false;
  if (eight && S.breakShot) N.msg = N.msg || '8 ball back on its spot';
  N.breakShot = false; N.kitchen = false;
  return N;
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function freshState(breaker) {
  const bs = new Array(16);
  bs[0] = mkBall(0, HEAD_X, H / 2);
  const sol = shuffle([1, 2, 3, 4, 5, 6, 7]), str = shuffle([9, 10, 11, 12, 13, 14, 15]);
  const slots = new Array(15).fill(0); slots[4] = 8;
  const sFirst = Math.random() < 0.5;
  slots[10] = sFirst ? sol.pop() : str.pop(); slots[14] = sFirst ? str.pop() : sol.pop();
  const rest = shuffle([...sol, ...str]);
  for (let i = 0; i < 15; i++) if (!slots[i]) slots[i] = rest.pop();
  const sp = D + 0.06; let i = 0;
  for (let r = 0; r < 5; r++) for (let j = 0; j <= r; j++) { const n = slots[i++]; bs[n] = mkBall(n, FOOT_X + r * sp * 0.8660254, H / 2 + (j - r / 2) * sp); }
  return { balls: bs, turn: breaker, breaker, groups: [null, null], placing: true, kitchen: true, breakShot: true, over: false, winner: -1, reason: '', msg: '', seq: 0, seats: null, names: null, assigned: false };
}
const pack = bs => bs.map(b => [b.x, b.y, b.live ? 1 : 0]);
const unpackBalls = arr => arr.map((p, n) => { const b = mkBall(n, p[0], p[1]); b.live = !!p[2]; return b; });
const packState = S => ({ ...S, balls: pack(S.balls) });
const unpackState = s => ({ ...s, balls: unpackBalls(s.balls) });

/* ---------- Computer opponent ---------- */
const LEVELS = ['Beginner', 'Easy', 'Medium', 'Hard', 'Pro'];
const AI = [

const bar = $('power');

window.addEventListener('keydown', e => {

function startOffline(m) {

}
const ACT = {

  online: () => showOnline(''),

  help: () => showHelp(),

$('menuBtn').addEventListener('click', () => { snd.init(); showPause(); });
$('helpBtn').addEventListener('click', () => { snd.init(); showHelp(); });

/* ---------- Online (Ludvig.mp, turn-based: the shooter simulates and sends the result) ---------- */
const ERR = { 'not-found': 'No game with that code.', full: 'That game is full.', 'rate-limited': 'Too many tries. Wait a minute.', 'bad-request': 'Check the code.' };
function showOnline(err, code) {
  if (!window.Ludvig || !window.Ludvig.mp) err = err || 'Online play is not available here.';
  openOverlay('online', `<button class="icon x" data-act="menu" aria-label="Back">${ICON('close')}</button><h2>Online</h2>
    <button class="btn primary" data-act="quick">Quick match</button>
    <button class="btn" data-act="create">Private game</button>
    <div class="sep"></div>
    <div class="row"><input class="code" maxlength="4" placeholder="Code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Game code" value="${esc(code || '')}"><button class="btn" data-act="join" style="flex:.6">Join</button></div>
    <p class="err" role="alert">${esc(err || '')}</p>`);

}
function showBusy(text) { openOverlay('busy', `<h2>${esc(text)}</h2><button class="btn" data-act="cancel">Cancel</button>`); }
function inviteUrl() { return `${location.origin}${location.pathname}?${SLUG}=${net.code}`; }
function showWaiting() {
  const share = navigator.share && touchMode;
  openOverlay('waiting', `<h2>Waiting for an opponent</h2><p class="muted">Share the code or the link</p>
    <p class="codebig">${esc(net.code)}</p>
    <button class="btn primary" data-act="invite">${ICON('link')}${share ? 'Share invite link' : 'Copy invite link'}</button>
    <button class="btn" data-act="cancel">Cancel</button>`, true);
}
async function shareInvite(b) {
  const url = inviteUrl();
  if (navigator.share && touchMode) { try { await navigator.share({ title: 'Velvet Pool', url }); return; } catch { /* fall back to copy */ } }
  try { await navigator.clipboard.writeText(url); b.innerHTML = ICON('check') + 'Link copied'; }
  catch { b.textContent = url; }
}
function showNotice(kind, text, rejoin) {
  openOverlay(kind, `<h2>${esc(text)}</h2>${kind === 'away' ? `<p class="muted">They can come back with code ${esc(net.code)}.</p>` : ''}
    ${rejoin ? '<button class="btn primary" data-act="rejoin">Rejoin</button>' : ''}
    <button class="btn" data-act="leave">${kind === 'away' ? 'Leave game' : 'Main menu'}</button>`, true);
}
async function goOnline(kind, code, silent) {

  let room;

    room = kind === 'create' ? await Ludvig.mp.create({ game: SLUG, max: 2 })
      : kind === 'quick' ? await Ludvig.mp.join({ game: SLUG, quick: true, max: 2 })
      : await Ludvig.mp.join({ game: SLUG, room: code, max: 2 });

function leaveOnline(quiet) {

/* ---------- Boot ---------- */

const params = new URLSearchParams(location.search), invite = params.get(SLUG);
let saved = null; try { saved = sessionStorage.getItem(KEY + 'room'); } catch { /* ignore */ }
if (invite) {

})();
